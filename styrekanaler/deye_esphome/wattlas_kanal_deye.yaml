      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('switch.min_inverter_grid_charge') }}"
        state: "{{ is_state('switch.min_inverter_grid_charge', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: {entity_id: switch.min_inverter_grid_charge}
        turn_off:
          - action: switch.turn_off
            target: {entity_id: switch.min_inverter_grid_charge}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: "{{ has_value('switch.min_inverter_solar_sell') }}"
        state: "{{ is_state('switch.min_inverter_solar_sell', 'on') }}"
