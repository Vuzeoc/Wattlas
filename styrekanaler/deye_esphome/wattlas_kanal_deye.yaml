  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        availability: "{{ has_value('switch.min_inverter_time_of_use') }}"
        state: "{{ is_state('switch.min_inverter_time_of_use', 'on') }}"
  # Målinger til økonomi, rapport og app (kWh-tællere). Produktion = Deye + evt. inverter på GEN-porten (mikroinverter).
  - sensor:
      - name: Wattlas produktion i dag
        unique_id: wattlas_i_dag_produktion
        default_entity_id: sensor.wattlas_i_dag_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_daily_production') }}"
        state: "{{ (states('sensor.min_inverter_daily_production') | float(0) ) | round(2) }}"
      - name: Wattlas produktion i alt
        unique_id: wattlas_total_produktion
        default_entity_id: sensor.wattlas_total_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_total_pv_production') }}"
        state: "{{ (states('sensor.min_inverter_total_pv_production') | float(0) ) | round(2) }}"
      - name: Wattlas købt i dag
        unique_id: wattlas_i_dag_koebt
        default_entity_id: sensor.wattlas_i_dag_koebt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_daily_energy_bought') }}"
        state: "{{ states('sensor.min_inverter_daily_energy_bought') | float(0) }}"
      - name: Wattlas solgt i dag
        unique_id: wattlas_i_dag_solgt
        default_entity_id: sensor.wattlas_i_dag_solgt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_daily_energy_sold') }}"
        state: "{{ states('sensor.min_inverter_daily_energy_sold') | float(0) }}"
      - name: Wattlas købt i alt
        unique_id: wattlas_total_koebt
        default_entity_id: sensor.wattlas_total_koebt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_total_energy_bought') }}"
        state: "{{ states('sensor.min_inverter_total_energy_bought') | float(0) }}"
      - name: Wattlas solgt i alt
        unique_id: wattlas_total_solgt
        default_entity_id: sensor.wattlas_total_solgt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_total_energy_sold') }}"
        state: "{{ states('sensor.min_inverter_total_energy_sold') | float(0) }}"
      - name: Wattlas forbrug i alt
        unique_id: wattlas_total_forbrug
        default_entity_id: sensor.wattlas_total_forbrug
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_total_consumption') }}"
        state: "{{ states('sensor.min_inverter_total_consumption') | float(0) }}"
  - binary_sensor:
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_inverter_running_status %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_inverter_pv1_power')) and is_number(states('sensor.min_inverter_pv2_power')) }}"
  - sensor:
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_inverter_pv1_power')) }}"
        state: "{{ [0, (states.sensor | selectattr('entity_id', 'match', 'sensor.min_inverter_pv[0-9]_power$') | map(attribute='state') | map('float', 0) | sum)] | max | round(0) }}"
utility_meter:
  wattlas_i_dag_forbrug:
    unique_id: wattlas_i_dag_forbrug
    source: sensor.wattlas_total_forbrug
    cycle: daily
  wattlas_i_dag_ladet:
    unique_id: wattlas_i_dag_ladet
    source: sensor.min_inverter_total_charge_of_the_battery
    cycle: daily
  wattlas_i_dag_afladet:
    unique_id: wattlas_i_dag_afladet
    source: sensor.min_inverter_total_discharge_of_the_battery
    cycle: daily
