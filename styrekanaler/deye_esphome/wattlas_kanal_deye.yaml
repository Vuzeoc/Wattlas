# Wattlas styrekanal – Deye via ESPHome (klatremis/esphome-for-deye, ESP32 + RS485 direkte på inverteren). EKSPERIMENTEL.
# Enhedsnavnene er klatremis' (device_type = prefix, fx sun12k_*). Har du omdøbt sensorerne, finder opsætningens tjek dem ikke.
# Kernen (emhass_*.yaml, wattlas_styring.yaml) taler KUN med disse Wattlas-entiteter. Vil man bruge en anden
# inverter (fx SunMate eller Sunsynk), udskiftes denne fil med en anden styrekanal med samme entiteter.
# Netladning pr. tidsprogram: kontakten "Time point N charge enable" (netladning til/fra).
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        availability: "{{ has_value('switch.min_inverter_time_point_1_charge_enable') }}"
        state: "{{ is_state('switch.min_inverter_time_point_1_charge_enable', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: {entity_id: switch.min_inverter_time_point_1_charge_enable}
        turn_off:
          - action: switch.turn_off
            target: {entity_id: switch.min_inverter_time_point_1_charge_enable}
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
