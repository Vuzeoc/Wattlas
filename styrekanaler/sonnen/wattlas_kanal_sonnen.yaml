# Wattlas styrekanal – SonnenBatterie (lokalt API v2 med skrivetoken). Oprindeligt bidrag fra hornbech (PR #1).
# EKSPERIMENTEL: læsningen er bygget mod en rigtig SonnenBatterie (fw 1.40.5), styringen er ikke kørt i drift.
# Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Krav: "JSON API for Reading" og "JSON API for Writing" slået til i batteriets dashboard under Software-Integration.
# Adresse og token indtastes i Wattlas-opsætningen og sættes ind i adresserne og Auth-Token-linjerne herunder.
# (Pladsholderne må kun stå dér: tokenet fjernes igen fra de linjer, når filen flyttes til en backup-mappe.)
#
# Sådan styres batteriet:
#  - Netladning: manual mode (EM_OperatingMode=1) og ladnings-setpoint i W (POST /api/v2/setpoint/charge/{W}).
#    Wattlas skriver strøm i A; kanalen ganger med batterispændingen (Ubat). Slås netladningen fra, ryddes setpointene,
#    og batteriet får sin egen driftstilstand tilbage (husket første gang kanalen overtager – fx mode 10 = tidsplan;
#    ukendt eller ugyldig værdi giver mode 2 = selvforbrug).
#  - Fasegrænse: batteriet måler kun husets forbrug pr. fase. Sonnen eco er enfaset, men kernen regner med en trefaset
#    inverter (3 × fasens plads). Derfor sætter kanalen netladestrømmens maks. til det, den VÆRSTE fase har plads til:
#    (fasegrænse × V − husets forbrug på fasen) × 0,95 / Ubat. Kernen går aldrig over maks.
#  - Tidsprogrammerne p1–p6 findes ikke i Sonnens API: de huskes i hjælpere, og Wattlas stopper selv ladningen ved
#    programmets mål-SOC. "Gem batteriet" og solsalg kan ikke styres (fw 1.40.5 har ingen nøgle til det).
#  - Går HA ned under netladning, lader batteriet videre med det sidste setpoint, til det er fuldt (ingen nedtælling).
rest_command:
  sonnen_saet_mode:
    url: "__SONNEN_HOST__/api/v2/configurations"
    method: put
    content_type: "application/x-www-form-urlencoded"
    headers:
      Auth-Token: "__SONNEN_TOKEN__"
    payload: "EM_OperatingMode={{ mode }}"
  sonnen_lad:
    url: "__SONNEN_HOST__/api/v2/setpoint/charge/{{ watt | int }}"
    method: post
    headers:
      Auth-Token: "__SONNEN_TOKEN__"
  sonnen_aflad:
    url: "__SONNEN_HOST__/api/v2/setpoint/discharge/{{ watt | int }}"
    method: post
    headers:
      Auth-Token: "__SONNEN_TOKEN__"

input_boolean:
  wattlas_sonnen_solsalg:
    name: Wattlas Sonnen solsalg (husket – Sonnen kan ikke styre det)
  wattlas_sonnen_p1:
    name: Wattlas Sonnen netladning program 1 (husket)
  wattlas_sonnen_p2:
    name: Wattlas Sonnen netladning program 2 (husket)
  wattlas_sonnen_p3:
    name: Wattlas Sonnen netladning program 3 (husket)
  wattlas_sonnen_p4:
    name: Wattlas Sonnen netladning program 4 (husket)
  wattlas_sonnen_p5:
    name: Wattlas Sonnen netladning program 5 (husket)
  wattlas_sonnen_p6:
    name: Wattlas Sonnen netladning program 6 (husket)
input_number:
  wattlas_sonnen_netladestroem:
    name: Wattlas Sonnen netladestrøm (husket)
    min: 0
    max: 400
    step: 1
    unit_of_measurement: A
  # batteriets egen driftstilstand huskes, så den kan gives tilbage, når Wattlas slipper
  wattlas_sonnen_egen_driftstilstand:
    name: Wattlas Sonnen – din egen driftstilstand (husket)
    min: 0
    max: 10
    step: 1
  wattlas_sonnen_p1_soc:
    name: Wattlas Sonnen program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p1_power:
    name: Wattlas Sonnen program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sonnen_p2_soc:
    name: Wattlas Sonnen program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p2_power:
    name: Wattlas Sonnen program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sonnen_p3_soc:
    name: Wattlas Sonnen program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p3_power:
    name: Wattlas Sonnen program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sonnen_p4_soc:
    name: Wattlas Sonnen program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p4_power:
    name: Wattlas Sonnen program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sonnen_p5_soc:
    name: Wattlas Sonnen program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p5_power:
    name: Wattlas Sonnen program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sonnen_p6_soc:
    name: Wattlas Sonnen program 6 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sonnen_p6_power:
    name: Wattlas Sonnen program 6 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        state: "{{ is_state('input_boolean.wattlas_sonnen_p1', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p1}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p1}}]
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
        state: "{{ is_state('input_boolean.wattlas_sonnen_p2', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p2}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p2}}]
      - name: EMHASS netladning program 3
        unique_id: emhass_netladning_p3
        default_entity_id: switch.emhass_netladning_p3
        state: "{{ is_state('input_boolean.wattlas_sonnen_p3', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p3}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p3}}]
      - name: EMHASS netladning program 4
        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        state: "{{ is_state('input_boolean.wattlas_sonnen_p4', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p4}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
        state: "{{ is_state('input_boolean.wattlas_sonnen_p5', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p5}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p5}}]
      - name: EMHASS netladning program 6
        unique_id: emhass_netladning_p6
        default_entity_id: switch.emhass_netladning_p6
        state: "{{ is_state('input_boolean.wattlas_sonnen_p6', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_p6}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('sensor.min_sonnen_status') }}"
        state: "{{ state_attr('sensor.min_sonnen_status', 'OperatingMode') | int(-1) == 1 }}"
        turn_on:
          # husk batteriets egen driftstilstand (10 = tidsplan, 6 = backup, 2 = selvforbrug),
          # så den kan gives tilbage i turn_off. Kun når vi ikke allerede står i manual mode,
          # ellers ville vi gemme vores egen 1'er og give den tilbage for evigt.
          - if: "{{ state_attr('sensor.min_sonnen_status', 'OperatingMode') | int(-1) != 1 }}"
            then:
              - action: input_number.set_value
                target: {entity_id: input_number.wattlas_sonnen_egen_driftstilstand}
                data: {value: "{{ state_attr('sensor.min_sonnen_status', 'OperatingMode') | int(2) }}"}
          - action: rest_command.sonnen_saet_mode
            data: {mode: 1}
          - action: rest_command.sonnen_lad
            data:
              watt: "{{ (states('input_number.wattlas_sonnen_netladestroem') | float(0) * state_attr('sensor.min_sonnen_status', 'Ubat') | float(0)) | round(0) }}"
        turn_off:
          - action: rest_command.sonnen_lad
            data: {watt: 0}
          - action: rest_command.sonnen_aflad
            data: {watt: 0}
          - action: rest_command.sonnen_saet_mode
            data:
              # giv batteriet sin egen driftstilstand tilbage (fx 10 = tidsplan) i stedet
              # for altid at tvinge selvforbrug. Ukendt eller ugyldig værdi -> 2.
              mode: >-
                {% set husket = states('input_number.wattlas_sonnen_egen_driftstilstand') | int(0) %}
                {{ husket if husket in [2, 6, 10] else 2 }}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        state: "{{ is_state('input_boolean.wattlas_sonnen_solsalg', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sonnen_solsalg}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sonnen_solsalg}}]
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ has_value('sensor.min_sonnen_status') }}"
        state: "{{ states('input_number.wattlas_sonnen_netladestroem') | float(0) }}"
        min: 0
        # den værste fase: (fasegrænse × V − husets forbrug) med 5 % ladetab, i A ved batteriets spænding
        max: >-
          {% set v = state_attr('sensor.min_sonnen_status', 'Ubat') | float(0) %}
          {% set ns = namespace(plads=999999) %}
          {% for i in range(1, 4) %}
            {% set ns.plads = [ns.plads, states('input_number.wattlas_fase_graense_a') | float(0) * states('sensor.min_sonnen_maaler_v_l' ~ i) | float(0)
                                         - states('sensor.min_sonnen_maaler_w_l' ~ i) | float(999999)] | min %}
          {% endfor %}
          {{ [400, ([0, ns.plads] | max * 0.95 / v) | round(0, 'floor')] | min if v > 0 else 0 }}
        step: 1
        unit_of_measurement: A
        set_value:
          - action: input_number.set_value
            target: {entity_id: input_number.wattlas_sonnen_netladestroem}
            data: {value: "{{ value }}"}
          - if: "{{ state_attr('sensor.min_sonnen_status', 'OperatingMode') | int(-1) == 1 }}"
            then:
              - action: rest_command.sonnen_lad
                data:
                  watt: "{{ (value | float(0) * state_attr('sensor.min_sonnen_status', 'Ubat') | float(0)) | round(0) }}"
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        state: "{{ states('input_number.wattlas_sonnen_p1_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p1_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
        unique_id: wattlas_program_1_power
        default_entity_id: number.wattlas_program_1_power
        state: "{{ states('input_number.wattlas_sonnen_p1_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p1_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 SOC
        unique_id: wattlas_program_2_soc
        default_entity_id: number.wattlas_program_2_soc
        state: "{{ states('input_number.wattlas_sonnen_p2_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p2_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 effekt
        unique_id: wattlas_program_2_power
        default_entity_id: number.wattlas_program_2_power
        state: "{{ states('input_number.wattlas_sonnen_p2_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p2_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 SOC
        unique_id: wattlas_program_3_soc
        default_entity_id: number.wattlas_program_3_soc
        state: "{{ states('input_number.wattlas_sonnen_p3_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p3_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 effekt
        unique_id: wattlas_program_3_power
        default_entity_id: number.wattlas_program_3_power
        state: "{{ states('input_number.wattlas_sonnen_p3_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p3_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 SOC
        unique_id: wattlas_program_4_soc
        default_entity_id: number.wattlas_program_4_soc
        state: "{{ states('input_number.wattlas_sonnen_p4_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p4_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 effekt
        unique_id: wattlas_program_4_power
        default_entity_id: number.wattlas_program_4_power
        state: "{{ states('input_number.wattlas_sonnen_p4_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p4_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 SOC
        unique_id: wattlas_program_5_soc
        default_entity_id: number.wattlas_program_5_soc
        state: "{{ states('input_number.wattlas_sonnen_p5_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p5_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 effekt
        unique_id: wattlas_program_5_power
        default_entity_id: number.wattlas_program_5_power
        state: "{{ states('input_number.wattlas_sonnen_p5_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p5_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 SOC
        unique_id: wattlas_program_6_soc
        default_entity_id: number.wattlas_program_6_soc
        state: "{{ states('input_number.wattlas_sonnen_p6_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p6_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 effekt
        unique_id: wattlas_program_6_power
        default_entity_id: number.wattlas_program_6_power
        state: "{{ states('input_number.wattlas_sonnen_p6_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sonnen_p6_power}, data: {value: "{{ value }}"}}]
  - sensor:
      - name: Wattlas maks. ladestrøm
        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ state_attr('sensor.min_sonnen_status', 'Ubat') | float(0) > 0 and is_number(states('sensor.min_sonnen_konfiguration')) }}"
        state: "{{ (states('sensor.min_sonnen_konfiguration') | float(0) / state_attr('sensor.min_sonnen_status', 'Ubat') | float(1)) | round(0) }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ state_attr('sensor.min_sonnen_status', 'Ubat') | float(0) > 0 and is_number(states('sensor.min_sonnen_konfiguration')) }}"
        state: "{{ (states('sensor.min_sonnen_konfiguration') | float(0) / state_attr('sensor.min_sonnen_status', 'Ubat') | float(1)) | round(0) }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.min_sonnen_status', 'Production_W')) }}"
        state: "{{ [0, state_attr('sensor.min_sonnen_status', 'Production_W') | float(0)] | max | round(0) }}"
      # effekter til dagstællerne (Sonnen har ingen tællere i API'et). GridFeedIn_W er negativ ved køb, Pac_total_W negativ ved ladning
      - name: min_sonnen netkøb
        unique_id: min_sonnen_netkoeb
        default_entity_id: sensor.min_sonnen_netkoeb
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.min_sonnen_status', 'GridFeedIn_W')) }}"
        state: "{{ [0, -(state_attr('sensor.min_sonnen_status', 'GridFeedIn_W') | float(0))] | max | round(0) }}"
      - name: min_sonnen solgt
        unique_id: min_sonnen_solgt
        default_entity_id: sensor.min_sonnen_solgt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.min_sonnen_status', 'GridFeedIn_W')) }}"
        state: "{{ [0, state_attr('sensor.min_sonnen_status', 'GridFeedIn_W') | float(0)] | max | round(0) }}"
      - name: min_sonnen ladet
        unique_id: min_sonnen_ladet
        default_entity_id: sensor.min_sonnen_ladet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.min_sonnen_status', 'Pac_total_W')) }}"
        state: "{{ [0, -(state_attr('sensor.min_sonnen_status', 'Pac_total_W') | float(0))] | max | round(0) }}"
      - name: min_sonnen afladet
        unique_id: min_sonnen_afladet
        default_entity_id: sensor.min_sonnen_afladet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.min_sonnen_status', 'Pac_total_W')) }}"
        state: "{{ [0, state_attr('sensor.min_sonnen_status', 'Pac_total_W') | float(0)] | max | round(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        state: "{{ is_state('binary_sensor.wattlas_forbindelse', 'on') and is_number(state_attr('sensor.min_sonnen_status', 'OperatingMode')) }}"
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_sonnen_status %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(state_attr('sensor.min_sonnen_status', 'Production_W')) }}"

# Sonnen har ingen dagstællere og ingen totaler i API'et – de laves her med HA's egne værktøjer.
sensor:
  - platform: integration
    source: sensor.emhass_solproduktion_samlet
    name: wattlas_total_produktion
    unique_id: wattlas_total_produktion
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_sonnen_netkoeb
    name: wattlas_total_koebt
    unique_id: wattlas_total_koebt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_sonnen_solgt
    name: wattlas_total_solgt
    unique_id: wattlas_total_solgt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_sonnen_status
    name: wattlas_total_forbrug
