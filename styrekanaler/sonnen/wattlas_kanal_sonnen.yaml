# Wattlas styrekanal – SonnenBatterie (lokalt API v2 med skrivetoken).
# ALPHA: bygget ud fra en SonnenBatterie (fw 1.40.5) og valideret med HA's config-check, men ikke kørt i
# drift endnu. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Krav: "JSON API for Reading" og "JSON API for Writing" slået til i batteriets dashboard under
# Software-Integration. Host og token indtastes i Wattlas-opsætningen og sættes ind i denne fil, hvor der
# står __SONNEN_HOST__ og __SONNEN_TOKEN__. Firmware 1.40 eller nyere.
#
# Sådan styres batteriet:
#  - Netladning: manual mode (EM_OperatingMode=1) og ladnings-setpoint i W (POST /api/v2/setpoint/charge/{W}).
#    Wattlas skriver strøm i A; kanalen ganger med batterispændingen (Ubat) og sender W. Når netladningen
#    slås fra, ryddes begge setpoints, og batteriet går i selvforbrug (mode 2), så det aflader til huset.
#  - Programvinduerne p1–p6 findes ikke i Sonnens API. Switchene er optimistiske, og det er Wattlas selv,
#    der stopper netladningen ved programmets mål-SOC (den skriver netladestrøm 0 og slukker switchene).
#    Program-SOC og -effekt accepteres uden at skrive til batteriet.
#  - Solssalg: fw 1.40.5 har ingen feed-in-nøgle i API'et (EM_US_GEN_POWER_SET_POINT er generator-setpoint,
#    ikke feed-in), så skiftet registreres men påvirker ikke batteriet. Se docs/STYREKANALER.md.
rest_command:
  sonnen_saet_mode:
    url: "__SONNEN_HOST__/api/v2/configurations"
    method: put
    content_type: "application/x-www-form-urlencoded"
    headers:
      Auth-Token: __SONNEN_TOKEN__
    payload: "EM_OperatingMode={{ mode }}"
  sonnen_lad:
    url: "__SONNEN_HOST__/api/v2/setpoint/charge/{{ watt | int }}"
    method: post
    headers:
      Auth-Token: __SONNEN_TOKEN__
  sonnen_aflad:
    url: "__SONNEN_HOST__/api/v2/setpoint/discharge/{{ watt | int }}"
    method: post
    headers:
      Auth-Token: __SONNEN_TOKEN__
template:
- switch:
  - name: Wattlas netladning
    unique_id: wattlas_netladning
    default_entity_id: switch.wattlas_netladning
    availability: "{{ has_value('sensor.min_sonnen_status') }}"
    state: "{{ state_attr('sensor.min_sonnen_status','OperatingMode') | int(-1) == 1 }}"
    turn_on:
    - action: rest_command.sonnen_saet_mode
      data: {mode: 1}
    - action: rest_command.sonnen_lad
      data:
        watt: "{{ (states('number.wattlas_netladestroem') | float(0) * state_attr('sensor.min_sonnen_status','Ubat') | float(48)) | round(0) }}"
    turn_off:
    - action: rest_command.sonnen_lad
      data: {watt: 0}
    - action: rest_command.sonnen_aflad
      data: {watt: 0}
    - action: rest_command.sonnen_saet_mode
      data: {mode: 2}
  - name: EMHASS netladning program 1
    unique_id: emhass_netladning_p1
    default_entity_id: switch.emhass_netladning_p1
    optimistic: true
    turn_on: []
    turn_off: []
  - name: EMHASS netladning program 2
    unique_id: emhass_netladning_p2
    default_entity_id: switch.emhass_netladning_p2
    optimistic: true
    turn_on: []
    turn_off: []
  - name: EMHASS netladning program 3
    unique_id: emhass_netladning_p3
    default_entity_id: switch.emhass_netladning_p3
    optimistic: true
    turn_on: []
    turn_off: []
  - name: EMHASS netladning program 4
    unique_id: emhass_netladning_p4
    default_entity_id: switch.emhass_netladning_p4
    optimistic: true
    turn_on: []
    turn_off: []
  - name: EMHASS netladning program 5
    unique_id: emhass_netladning_p5
    default_entity_id: switch.emhass_netladning_p5
    optimistic: true
    turn_on: []
    turn_off: []
  - name: EMHASS netladning program 6
    unique_id: emhass_netladning_p6
    default_entity_id: switch.emhass_netladning_p6
    optimistic: true
    turn_on: []
    turn_off: []
  - name: Wattlas solsalg
    unique_id: wattlas_solsalg
    default_entity_id: switch.wattlas_solsalg
    optimistic: true
    turn_on: []
    turn_off: []
- number:
  - name: Wattlas netladestrøm
    unique_id: wattlas_netladestroem
    default_entity_id: number.wattlas_netladestroem
    availability: "{{ has_value('sensor.min_sonnen_status') }}"
    optimistic: true
    min: 0
    max: 100
    step: 1
    unit_of_measurement: A
    set_value:
    - action: rest_command.sonnen_lad
      data:
        watt: "{{ (value | float(0) * state_attr('sensor.min_sonnen_status','Ubat') | float(48)) | round(0) }}"
  - name: Wattlas program 1 SOC
    unique_id: wattlas_program_1_soc
    default_entity_id: number.wattlas_program_1_soc
    optimistic: true
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    set_value: []
