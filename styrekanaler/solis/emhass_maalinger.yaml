# Wattlas styrekanal – Solis: målinger fra solax_modbus (Solis FB00, trefaset; enheden min_solis_*).
# Fortegn: elmålerens effekt (Meter Active Power Total/L1–L3, kW) ANTAGES positiv ved salg – solax_modbus dokumenterer det
# ikke. Batteriet læses som to positive tal (Battery Input/Output Energy, W – trods navnet effekt), så dets retning er sikker.
# Til kernen: net og fasetal positive ved køb, batteri positivt ved afladning.
# Regnestykke-tjek: sol + afladning + køb skal give husets forbrug (House Load + Bypass Load), og faserne skal summe til
# totalen. Passer det ikke i 2 minutter (fx et forkert fortegn), bruges målingerne ikke, og Wattlas styrer ikke.
# Kommando-tjek: aflader batteriet, mens Wattlas beder om ladning, spærres kanalen i 1 time.
# Batterispændingen er kanalens faste beregningsspænding på 50 V (højvoltbatteri, se wattlas_kanal_solis.yaml).
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      sample: |-
        {% set t = as_timestamp(now()) %}
        {% set status = states('sensor.min_solis_inverter_status') %}
        {% set net = -(states('sensor.min_solis_meter_active_power_total') | float(0)) * 1000 %}
        {% set imp = [0, net] | max %}
        {% set load = states('sensor.min_solis_house_load') | float(0) + states('sensor.min_solis_bypass_load') | float(0) %}
        {% set ladning = states('sensor.min_solis_battery_input_energy') | float(0) - states('sensor.min_solis_battery_output_energy') | float(0) %}
        {% set chg = [0, ladning] | max %}
        {% set dis = [0, -ladning] | max %}
        {% set pv = states('sensor.min_solis_pv_total_power') | float(0) %}
        {% set faser = [states('sensor.min_solis_meter_active_power_l1') | float(0), states('sensor.min_solis_meter_active_power_l2') | float(0),
                        states('sensor.min_solis_meter_active_power_l3') | float(0)] %}
        {% set m = dict(
          load_w_totalpower = load | round(0),
          grid_out_total_power = net | round(0),
          battery_output_w_power = -ladning,
          battery_soc = states('sensor.min_solis_battery_soc'),
          battery_voltage = 50,
          inverter_status = 'Normal' if status in ['Normal Running', 'Generating'] else status,
          battery_temperature = 'unavailable',
          inverter_temperature = states('sensor.min_solis_inverter_temperature'),
          external_ct_w_l1 = (-faser[0] * 1000) | round(0),
          external_ct_w_l2 = (-faser[1] * 1000) | round(0),
          external_ct_w_l3 = (-faser[2] * 1000) | round(0),
          grid_current_v_l1 = states('sensor.min_solis_meter_ac_voltage_l1'),
          grid_current_v_l2 = states('sensor.min_solis_meter_ac_voltage_l2'),
          grid_current_v_l3 = states('sensor.min_solis_meter_ac_voltage_l3')) %}
        {% set kilder = ['sensor.min_solis_meter_active_power_total', 'sensor.min_solis_house_load', 'sensor.min_solis_battery_input_energy',
                         'sensor.min_solis_battery_output_energy', 'sensor.min_solis_battery_soc', 'sensor.min_solis_pv_total_power',
                         'sensor.min_solis_meter_active_power_l1', 'sensor.min_solis_meter_active_power_l2', 'sensor.min_solis_meter_active_power_l3',
                         'sensor.min_solis_meter_ac_voltage_l1', 'sensor.min_solis_meter_ac_voltage_l2', 'sensor.min_solis_meter_ac_voltage_l3'] %}
        {% set ns = namespace(ok=has_value('sensor.min_solis_inverter_status'), aeldst=t) %}
        {% for e in kilder %}
          {% set s = states[e] %}
          {% if s is none or not is_number(s.state) %}{% set ns.ok = false %}
          {% else %}{% set ns.aeldst = [ns.aeldst, as_timestamp(s.last_reported, 0)] | min %}{% endif %}
        {% endfor %}
        {# Kommando-tjek, mens Wattlas beder Solis om at lade: aflader batteriet i stedet, lades der tydeligt fra nettet,
           uden at elmåleren viser køb (måleren mangler eller sidder forkert), eller lades der mere fra nettet end bedt om
           (kernens fasegrænse regner med det, den bad om), bruges målingerne ikke. #}
        {% set lader = is_state('input_boolean.wattlas_solis_fjern_styret', 'on')
                       and is_state('select.min_solis_dispatch_control_mode', 'Battery Charge')
                       and states('number.min_solis_dispatch_power') | float(0) > 0 %}
        {% set fra_net = chg - [0, pv - load] | max %}
        {% set bedt = states('number.min_solis_dispatch_power') | float(0) %}
        {# Regnestykket (målingerne læses ikke samtidig – derfor rummelige grænser) fanger et forkert fortegn på elmåleren #}
        {% set afvig = (pv - ladning + net - load) | abs %}
        {% set fase_afvig = ((faser | sum) * 1000 + net) | abs %}
        {% set balance_ok = afvig <= [600, load * 0.15] | max and fase_afvig <= 500
                            and not (lader and (dis > 300 or (fra_net > 1000 and imp < 200) or fra_net > bedt * 1.25 + 300)) %}
        {# Blokér først efter 2 min i træk: batteriet skifter ikke retning på et øjeblik, og målingerne læses ikke samtidig. #}
        {% set fejl_siden = 0 if balance_ok else (state_attr('sensor.emhass_maalekilde', 'balance_fejl_siden') | float(0) or t) %}
        {# Kommando-fejlene ses kun, mens der lades: stopper kernen ladningen, ser alt normalt ud igen, og den ville starte
           forfra. Derfor spærres kanalen i 1 time efter en afvisning (shortcut: fast 1 time, ingen nulstilling – ret ved behov). #}
        {% set spaerret_til = t + 3600 if not balance_ok and t - fejl_siden >= 120
                              else state_attr('sensor.emhass_maalekilde', 'spaerret_til') | float(0) %}
        {% set ok = ns.ok and (balance_ok or t - fejl_siden < 120) and t >= spaerret_til and 0 <= t - ns.aeldst <= 90 %}
        {% set tider = namespace(d={}) %}
        {% for k in m %}{% set tider.d = dict(tider.d, **{k: ns.aeldst}) %}{% endfor %}
        {{ dict(source=('Solis' if ok else 'Ingen'), values=(m if ok else {}), afvigelse_w=afvig | round(0), fase_afvigelse_w=fase_afvig | round(0),
                times=(tider.d if ok else {}), solis_ok=ok, balance_ok=balance_ok, balance_fejl_siden=fejl_siden, spaerret_til=spaerret_til, time=t) }}
  sensor:
  - name: EMHASS målekilde
    unique_id: emhass_maalekilde
    default_entity_id: sensor.emhass_maalekilde
    state: '{{ sample.source }}'
    attributes:
      values: '{{ sample[''values''] }}'
      raw_reported: '{{ sample[''times''] }}'
      solis_ok: '{{ sample[''solis_ok''] }}'
      afvigelse_w: '{{ sample[''afvigelse_w''] }}'
      fase_afvigelse_w: '{{ sample[''fase_afvigelse_w''] }}'
      balance_ok: '{{ sample[''balance_ok''] }}'
      balance_fejl_siden: '{{ sample[''balance_fejl_siden''] }}'
      spaerret_til: '{{ sample[''spaerret_til''] }}'
      sample_time: '{{ sample[''time''] }}'
- sensor:
  - name: EMHASS måling load_w_totalpower
    unique_id: emhass_m_load_w_totalpower
    default_entity_id: sensor.emhass_m_load_w_totalpower
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Solis''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''load_w_totalpower'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: EMHASS måling grid_out_total_power
    unique_id: emhass_m_grid_out_total_power
    default_entity_id: sensor.emhass_m_grid_out_total_power
