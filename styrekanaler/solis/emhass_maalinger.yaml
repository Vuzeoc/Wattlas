  binary_sensor:
  - name: EMHASS styrekanal (Solis)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['number.min_solis_dispatch_power','number.min_solis_dispatch_failsafe_interval','select.min_solis_dispatch_control_mode','select.min_solis_dispatch_grid_charging'] %}
       {# solax_modbus' lokale tal er "unknown", til de er skrevet første gang – de skal bare findes #}
       {% if states[e] is none or is_state(e, 'unavailable') %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.wattlas_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','solis_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=90
       and states('sensor.min_solis_remote_dispatch_function_version')|float(0) >= 1
       and states.button.min_solis_prepare_remote_dispatch is not none and states.button.min_solis_apply_remote_dispatch is not none
       and states.button.min_solis_disable_remote_dispatch is not none
       and states('input_number.wattlas_maks_ladeeffekt_w')|float(0) > 0 }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: >-
        Solis-styrekanalen er ikke klar – målinger mangler eller er gamle, regnestykket mellem sol, batteri, net og husforbrug
        passer ikke (fortegn), Remote Dispatch findes ikke (kræver plugin "Solis FB00" og "Remote Dispatch Function Version" 1
        eller mere), eller batteriet gjorde det modsatte af, hvad Wattlas bad om. Netopladning er forsøgt stoppet; faktisk
        inverterdrift skal kontrolleres.
