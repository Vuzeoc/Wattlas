    source: sensor.wattlas_total_solgt
    cycle: daily

automation:
  - id: wattlas_solis_styring
    alias: Wattlas Solis – styring
    description: >-
      Det eneste sted, Wattlas styrer Solis (Remote Dispatch). Lader fra nettet (fornyes hvert minut, kun op til det aktive
      programs SOC), holder batteriet (hverken ladning eller afladning) eller giver inverteren sin egen drift tilbage. Uden for
      styringen slås kun Wattlas' egen Remote Dispatch fra, og et stoppet solsalg gives tilbage.
    # en ny ordre afbryder den gamle: en kø ville kunne sende en forældet ladeordre, efter at ladningen er stoppet
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_boolean.wattlas_solis_netladning, input_number.wattlas_solis_netladestroem,
                    input_boolean.emhass_styring_aktiv, input_boolean.emhass_har_overtaget]
      - trigger: state
        entity_id: [input_boolean.wattlas_solis_p1, input_boolean.wattlas_solis_p2, input_boolean.wattlas_solis_p3,
                    input_boolean.wattlas_solis_p4, input_boolean.wattlas_solis_p5, input_boolean.wattlas_solis_p6]
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_solis_battery_soc') | float(-1) }}"
      maal: "{{ states('input_number.wattlas_solis_p' ~ periode ~ '_soc') | float(0) }}"
      effekt: "{{ states('input_number.wattlas_solis_p' ~ periode ~ '_power') | float(0) }}"
      # solax_modbus tager højst 24000 W
      loft: "{{ [states('input_number.wattlas_maks_ladeeffekt_w') | float(0), 24000] | min }}"
      # effekten fra nettet i hele 100 W, aldrig over loftet
      watt: "{{ ([states('input_number.wattlas_solis_netladestroem') | float(0) * 50, loft] | min / 100) | round(0, 'floor') * 100 }}"
      styrer: "{{ is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.emhass_har_overtaget', 'on') }}"
      overskud: "{{ states('sensor.min_solis_pv_total_power') | float(0) - states('sensor.wattlas_solis_husforbrug') | float(0) }}"
      tilstand: >-
        {% if styrer and is_state('input_boolean.wattlas_solis_netladning', 'on')
              and is_state('input_boolean.wattlas_solis_p' ~ periode, 'on') and watt >= 100 and 0 <= soc < maal %}lad
        {% elif styrer and (soc <= maal or effekt < 50) and overskud < 200 %}gem
        {% else %}fri{% endif %}
      valg: "{{ 'Battery Charge' if tilstand == 'lad' else 'Battery Hold' }}"
    conditions:
      # solax_modbus skal være klar (ved opstart kan Wattlas komme før inverteren), og inverteren skal kunne Remote Dispatch
      - condition: template
        value_template: >-
          {{ states.button.min_solis_apply_remote_dispatch is not none and states.button.min_solis_prepare_remote_dispatch is not none
             and states.select.min_solis_dispatch_control_mode is not none and soc >= 0
             and states('sensor.min_solis_remote_dispatch_function_version') | float(0) >= 1 }}
    actions:
      - choose:
          - conditions: "{{ tilstand in ['lad', 'gem'] }}"
            sequence:
              # tallene ligger kun i Home Assistant, til "Apply" sender dem (de står som "unknown", til de er skrevet første gang)
              - if: "{{ states('number.min_solis_dispatch_failsafe_interval') | float(0) != 5 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solis_dispatch_failsafe_interval}, data: {value: 5}}]
              - if: "{{ not is_state('select.min_solis_dispatch_control_mode', valg) }}"
                then: [{action: select.select_option, target: {entity_id: select.min_solis_dispatch_control_mode}, data: {option: "{{ valg }}"}}]
              - if: "{{ (states('number.min_solis_dispatch_power') | float(-1) - (watt if tilstand == 'lad' else 0)) | abs >= 1 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solis_dispatch_power}, data: {value: "{{ watt if tilstand == 'lad' else 0 }}"}}]
              - if: "{{ not is_state('select.min_solis_dispatch_grid_charging', 'Allow') }}"
                then: [{action: select.select_option, target: {entity_id: select.min_solis_dispatch_grid_charging}, data: {option: Allow}}]
              - if: "{{ states('number.min_solis_dispatch_soc_minimum') | float(-1) != 0 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solis_dispatch_soc_minimum}, data: {value: 0}}]
              - if: "{{ states('number.min_solis_dispatch_soc_maximum') | float(-1) != 100 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solis_dispatch_soc_maximum}, data: {value: 100}}]
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_solis_fjern_styret}
              # Prepare (slår Remote Dispatch til), medmindre den allerede er trykket efter sidste Disable og fulgt af en Apply (en
              # knaps tilstand er tidspunktet for sidste tryk) – og hvert 10. minut, ved HA-start, og når målingerne modsiger ordren
              # (inverteren er genstartet og har glemt den: så er den i gang igen, før kommando-tjekket spærrer efter 2 min)
              - if: >-
                  {% set d = as_timestamp(states('button.min_solis_disable_remote_dispatch'), 0) %}
                  {% set p = as_timestamp(states('button.min_solis_prepare_remote_dispatch'), 0) %}
                  {% set a = as_timestamp(states('button.min_solis_apply_remote_dispatch'), 0) %}
                  {{ not d < p < a or now().minute % 10 == 0 or trigger.platform == 'homeassistant'
                     or is_state_attr('sensor.emhass_maalekilde', 'balance_ok', false) }}
                then:
                  - action: button.press
                    target: {entity_id: button.min_solis_prepare_remote_dispatch}
                  # Solis skal have tid til at slå Remote Dispatch til, før kommandoen sendes (målt i solax_modbus: 2 s)
                  - delay: {seconds: 2}
              - action: button.press
                target: {entity_id: button.min_solis_apply_remote_dispatch}
        default:
          # kun Wattlas' egen Remote Dispatch slås fra – har du selv slået den til, røres den ikke
          - if: "{{ is_state('input_boolean.wattlas_solis_fjern_styret', 'on') }}"
            then:
              - action: button.press
                target: {entity_id: button.min_solis_disable_remote_dispatch}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_solis_fjern_styret}
          # stoppede Wattlas solsalget (negativ pris), må det ikke blive stående: din egen eksportgrænse tilbage
          - if: "{{ not styrer and is_state('input_boolean.wattlas_solis_salg_stoppet', 'on') }}"
            then: [{action: switch.turn_on, continue_on_error: true, target: {entity_id: switch.wattlas_solsalg}}]

  - id: wattlas_solis_stroemgraenser
    alias: Wattlas Solis – strømgrænser fra effekt
    description: >-
      Kanalen regner Solis-batteriet med 50 V, så Wattlas' strømgrænser (A) følger effekt-indstillingerne (W ÷ 50).
      Ændrer du fx maks. netladeeffekt, følger maks. netladestrøm med.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_number.wattlas_maks_ladeeffekt_w, input_number.wattlas_maks_afladeeffekt_w, input_number.wattlas_maks_netladeeffekt_w]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - {a: input_number.wattlas_maks_ladestroem_a, w: input_number.wattlas_maks_ladeeffekt_w}
            - {a: input_number.wattlas_maks_afladestroem_a, w: input_number.wattlas_maks_afladeeffekt_w}
            - {a: input_number.wattlas_maks_netladestroem_a, w: input_number.wattlas_maks_netladeeffekt_w}
          sequence:
            - if: >-
                {{ states(repeat.item.w) | float(0) > 0
                   and (states(repeat.item.a) | float(0) - (states(repeat.item.w) | float(0) / 50) | round(0)) | abs >= 1 }}
              then:
                - action: input_number.set_value
                  target: {entity_id: "{{ repeat.item.a }}"}
                  data: {value: "{{ (states(repeat.item.w) | float(0) / 50) | round(0) }}"}
