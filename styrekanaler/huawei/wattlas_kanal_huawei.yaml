# Wattlas styrekanal – Huawei SUN2000 (hybrid) + LUNA2000 + Huawei-elmåler via Huawei Solar (wlcrs/huawei_solar).
# ALPHA: bygget ud fra integrationens kildekode og Huaweis Modbus-dokumentation og testet mod en simuleret Huawei –
# ikke kørt i drift endnu. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Enheder (navnene vælges i opsætningen): inverter = min_huawei_*, batterier = min_luna_*, elmåler = min_hmaaler_*.
# Kræver skriveadgang i Huawei Solar ("elevate permissions" + installatør-adgangskode), og at elmålerens
# fasespændinger (Phase A/B/C voltage) er slået til – de er slået fra som standard.
#
# Højvoltbatteri: kernen regner i A ved et lavvoltbatteri. Kanalen bruger en fast beregningsspænding på 50 V
# (A × 50 = W) – samme tal som HUAWEI_V i opsætningen.
#
# Huawei har ingen tidsprogrammer p1–p6. Kanalen husker dem selv og bruger det aktive programs værdier i samme
# perioder som kernen (1: 01–05, 2: 05–09, 3: 09–13, 4: 13–17, 5: 17–21, 6: 21–01):
#   SOC    = bundgrænse (under den aflades ikke) og mål ved netladning
#   effekt = højeste afladeeffekt (0 W = gem batteriet)
# Netladning: huawei_solar.forcible_charge i 10 min ad gangen, fornyes hvert 5. min. Går HA ned, stopper
#   ladningen af sig selv inden for 10 min.
# Solsalg fra = højst 0 W til nettet; til = den eksport, du har lov til (Wattlas-indstillingen maks. eksport).
input_boolean:
  wattlas_huawei_netladning:
    name: Wattlas Huawei netladning (husket)
  wattlas_huawei_salg_stoppet:
    name: Wattlas Huawei har stoppet solsalget
  wattlas_huawei_tvangsladning:
    name: Wattlas Huawei har startet tvungen ladning
  wattlas_huawei_afladegraense_sat:
    name: Wattlas Huawei har ændret batteriets afladeeffekt
  wattlas_huawei_p1:
    name: Wattlas Huawei netladning program 1 (husket)
  wattlas_huawei_p2:
    name: Wattlas Huawei netladning program 2 (husket)
  wattlas_huawei_p3:
    name: Wattlas Huawei netladning program 3 (husket)
  wattlas_huawei_p4:
    name: Wattlas Huawei netladning program 4 (husket)
  wattlas_huawei_p5:
    name: Wattlas Huawei netladning program 5 (husket)
  wattlas_huawei_p6:
    name: Wattlas Huawei netladning program 6 (husket)
input_number:
  wattlas_huawei_egen_afladeeffekt:
    name: Wattlas Huawei – din egen afladeeffekt (husket)
    min: 0
    max: 50000
    step: 1
    unit_of_measurement: W
  wattlas_huawei_netladestroem:
    name: Wattlas Huawei netladestrøm (husket)
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: A
  wattlas_huawei_p1_soc:
    name: Wattlas Huawei program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p1_power:
    name: Wattlas Huawei program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_huawei_p2_soc:
    name: Wattlas Huawei program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p2_power:
    name: Wattlas Huawei program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_huawei_p3_soc:
    name: Wattlas Huawei program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p3_power:
    name: Wattlas Huawei program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_huawei_p4_soc:
    name: Wattlas Huawei program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p4_power:
    name: Wattlas Huawei program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_huawei_p5_soc:
    name: Wattlas Huawei program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p5_power:
    name: Wattlas Huawei program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_huawei_p6_soc:
    name: Wattlas Huawei program 6 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_huawei_p6_power:
    name: Wattlas Huawei program 6 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        state: "{{ is_state('input_boolean.wattlas_huawei_p1', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p1}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p1}}]
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
        state: "{{ is_state('input_boolean.wattlas_huawei_p2', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p2}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p2}}]
      - name: EMHASS netladning program 3
        unique_id: emhass_netladning_p3
        default_entity_id: switch.emhass_netladning_p3
        state: "{{ is_state('input_boolean.wattlas_huawei_p3', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p3}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p3}}]
      - name: EMHASS netladning program 4
        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        state: "{{ is_state('input_boolean.wattlas_huawei_p4', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p4}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
        state: "{{ is_state('input_boolean.wattlas_huawei_p5', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p5}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p5}}]
      - name: EMHASS netladning program 6
        unique_id: emhass_netladning_p6
        default_entity_id: switch.emhass_netladning_p6
        state: "{{ is_state('input_boolean.wattlas_huawei_p6', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_p6}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_huawei_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('switch.min_luna_charge_from_grid') }}"
        state: "{{ is_state('input_boolean.wattlas_huawei_netladning', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_huawei_netladning}}]
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.wattlas_huawei_netladning}
          # stoppes med det samme her (automationen nedenfor gør det også), så "fra" er fra, når kernen går videre
          - action: huawei_solar.stop_forcible_charge
            continue_on_error: true
            data: {device_id: "{{ device_id('sensor.min_luna_state_of_capacity') }}"}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: "{{ has_value('sensor.min_huawei_input_power') }}"
        # "til", indtil Wattlas selv har stoppet salget – en ny installation skriver derfor intet salgsloft til inverteren
        state: "{{ not is_state('input_boolean.wattlas_huawei_salg_stoppet', 'on') }}"
        turn_on:
          - action: huawei_solar.set_maximum_feed_grid_power
            data:
              device_id: "{{ device_id('sensor.min_huawei_input_power') }}"
              power: "{{ states('input_number.wattlas_maks_eksport_w') | int(0) }}"
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.wattlas_huawei_salg_stoppet}
        turn_off:
          - action: huawei_solar.set_maximum_feed_grid_power
            data:
              device_id: "{{ device_id('sensor.min_huawei_input_power') }}"
              power: 0
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.wattlas_huawei_salg_stoppet}
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ is_number(state_attr('number.min_luna_maximum_charging_power', 'max')) }}"
        state: "{{ states('input_number.wattlas_huawei_netladestroem') | float(0) }}"
        min: 0
        max: "{{ (state_attr('number.min_luna_maximum_charging_power', 'max') | float(0) / 50) | round(0, 'floor') }}"
        step: 1
        unit_of_measurement: A
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_netladestroem}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        state: "{{ states('input_number.wattlas_huawei_p1_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p1_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
        unique_id: wattlas_program_1_power
        default_entity_id: number.wattlas_program_1_power
        state: "{{ states('input_number.wattlas_huawei_p1_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p1_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 SOC
        unique_id: wattlas_program_2_soc
        default_entity_id: number.wattlas_program_2_soc
        state: "{{ states('input_number.wattlas_huawei_p2_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p2_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 effekt
        unique_id: wattlas_program_2_power
        default_entity_id: number.wattlas_program_2_power
        state: "{{ states('input_number.wattlas_huawei_p2_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p2_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 SOC
        unique_id: wattlas_program_3_soc
        default_entity_id: number.wattlas_program_3_soc
        state: "{{ states('input_number.wattlas_huawei_p3_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p3_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 effekt
        unique_id: wattlas_program_3_power
        default_entity_id: number.wattlas_program_3_power
        state: "{{ states('input_number.wattlas_huawei_p3_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p3_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 SOC
        unique_id: wattlas_program_4_soc
        default_entity_id: number.wattlas_program_4_soc
        state: "{{ states('input_number.wattlas_huawei_p4_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p4_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 effekt
        unique_id: wattlas_program_4_power
        default_entity_id: number.wattlas_program_4_power
        state: "{{ states('input_number.wattlas_huawei_p4_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p4_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 SOC
        unique_id: wattlas_program_5_soc
        default_entity_id: number.wattlas_program_5_soc
        state: "{{ states('input_number.wattlas_huawei_p5_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p5_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 effekt
        unique_id: wattlas_program_5_power
        default_entity_id: number.wattlas_program_5_power
        state: "{{ states('input_number.wattlas_huawei_p5_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p5_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 SOC
        unique_id: wattlas_program_6_soc
        default_entity_id: number.wattlas_program_6_soc
        state: "{{ states('input_number.wattlas_huawei_p6_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p6_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 effekt
        unique_id: wattlas_program_6_power
        default_entity_id: number.wattlas_program_6_power
        state: "{{ states('input_number.wattlas_huawei_p6_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_huawei_p6_power}, data: {value: "{{ value }}"}}]
  - sensor:
      # fra batteriets mærkeværdi (number-entitetens max), ikke den aktuelle indstilling – den sætter kanalen selv til 0 W
      - name: Wattlas maks. ladestrøm
        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ is_number(state_attr('number.min_luna_maximum_charging_power', 'max')) }}"
        state: "{{ (state_attr('number.min_luna_maximum_charging_power', 'max') | float(0) / 50) | round(0, 'floor') }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ is_number(state_attr('number.min_luna_maximum_discharging_power', 'max')) }}"
        state: "{{ (state_attr('number.min_luna_maximum_discharging_power', 'max') | float(0) / 50) | round(0, 'floor') }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_huawei_input_power')) }}"
        state: "{{ [0, states('sensor.min_huawei_input_power') | float(0)] | max | round(0) }}"
      # husets forbrug = inverterens AC-effekt + køb fra nettet (Huaweis elmåler: positiv = salg til nettet)
      - name: Wattlas husforbrug
        unique_id: wattlas_huawei_husforbrug
        default_entity_id: sensor.wattlas_huawei_husforbrug
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_huawei_active_power')) and is_number(states('sensor.min_hmaaler_active_power')) }}"
        state: "{{ [0, states('sensor.min_huawei_active_power') | float(0) - states('sensor.min_hmaaler_active_power') | float(0)] | max | round(0) }}"
      - name: Wattlas batteri ladet i dag
        unique_id: wattlas_i_dag_ladet
        default_entity_id: sensor.wattlas_i_dag_ladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_luna_day_charge') }}"
        state: "{{ states('sensor.min_luna_day_charge') | float(0) }}"
      - name: Wattlas batteri afladet i dag
        unique_id: wattlas_i_dag_afladet
        default_entity_id: sensor.wattlas_i_dag_afladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_luna_day_discharge') }}"
        state: "{{ states('sensor.min_luna_day_discharge') | float(0) }}"
      - name: Wattlas købt i alt
        unique_id: wattlas_total_koebt
        default_entity_id: sensor.wattlas_total_koebt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_hmaaler_consumption') }}"
        state: "{{ states('sensor.min_hmaaler_consumption') | float(0) }}"
      - name: Wattlas solgt i alt
        unique_id: wattlas_total_solgt
        default_entity_id: sensor.wattlas_total_solgt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_hmaaler_exported') }}"
        state: "{{ states('sensor.min_hmaaler_exported') | float(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        # Huawei har ingen tidsprogrammer; kanalens egne er aktive, når batteriet kan styres og står i
        # "Maximise self consumption" (i TOU eller "Fully fed to grid" følger batteriet ikke planen)
        state: >-
          {{ has_value('number.min_luna_maximum_discharging_power') and has_value('switch.min_luna_charge_from_grid')
             and is_state('select.min_luna_working_mode', 'maximise_self_consumption') }}
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_huawei_device_status %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_huawei_input_power')) }}"

# Huawei Solars dagstal for produktion er inverterens AC-udgang (inkl. batteriet). Produktion, forbrug og
# købt/solgt i dag laves derfor her med HA's egne værktøjer.
sensor:
  - platform: integration
    source: sensor.emhass_solproduktion_samlet
    name: wattlas_total_produktion  # navnet bliver entity_id
    unique_id: wattlas_total_produktion
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_huawei_husforbrug
    name: wattlas_total_forbrug  # navnet bliver entity_id
    unique_id: wattlas_total_forbrug
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
utility_meter:
  wattlas_i_dag_produktion:
    unique_id: wattlas_i_dag_produktion
    source: sensor.wattlas_total_produktion
    cycle: daily
  wattlas_i_dag_forbrug:
    unique_id: wattlas_i_dag_forbrug
    source: sensor.wattlas_total_forbrug
    cycle: daily
  wattlas_i_dag_koebt:
    unique_id: wattlas_i_dag_koebt
    source: sensor.wattlas_total_koebt
    cycle: daily
  wattlas_i_dag_solgt:
    unique_id: wattlas_i_dag_solgt
    source: sensor.wattlas_total_solgt
    cycle: daily

automation:
  - id: wattlas_huawei_netladning
    alias: Wattlas Huawei – netladning
    description: Lader fra nettet i 10 min ad gangen, mens kernen beder om det, og kun op til det aktive programs SOC.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_boolean.wattlas_huawei_netladning, input_number.wattlas_huawei_netladestroem]
      - trigger: state
        entity_id: [input_boolean.wattlas_huawei_p1, input_boolean.wattlas_huawei_p2, input_boolean.wattlas_huawei_p3,
                    input_boolean.wattlas_huawei_p4, input_boolean.wattlas_huawei_p5, input_boolean.wattlas_huawei_p6]
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_luna_state_of_capacity') | float(101) }}"
      maal: "{{ states('input_number.wattlas_huawei_p' ~ periode ~ '_soc') | float(0) }}"
      watt: >-
        {% set w = states('input_number.wattlas_huawei_netladestroem') | float(0) * 50 %}
        {{ [w, state_attr('number.min_luna_maximum_charging_power', 'max') | float(0)] | min | int(0) }}
      lad: >-
        {{ is_state('input_boolean.emhass_styring_aktiv', 'on')
           and is_state('input_boolean.wattlas_huawei_netladning', 'on') and is_state('input_boolean.wattlas_huawei_p' ~ periode, 'on')
           and watt >= 100 and soc < maal }}
      batteri: "{{ device_id('sensor.min_luna_state_of_capacity') }}"
    conditions:
      # Huawei Solar skal være klar (ved opstart kan Wattlas komme før inverteren) – ellers kendes tjenesterne ikke endnu
      - condition: template
        value_template: "{{ has_value('switch.min_luna_charge_from_grid') and batteri not in [none, 'None', ''] }}"
    actions:
      - if: "{{ lad }}"
        then:
          - if: "{{ not is_state('switch.min_luna_charge_from_grid', 'on') }}"
            then: [{action: switch.turn_on, target: {entity_id: switch.min_luna_charge_from_grid}}]
          - action: huawei_solar.forcible_charge
            data: {device_id: "{{ batteri }}", duration: 10, power: "{{ watt }}"}
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.wattlas_huawei_tvangsladning}
        else:
          # kun hvis Wattlas selv har startet en ladning – hver kommando er flere skrivninger i inverteren
          - if: "{{ not is_state('input_boolean.wattlas_huawei_tvangsladning', 'off') }}"
            then:
              - action: huawei_solar.stop_forcible_charge
                continue_on_error: true
                data: {device_id: "{{ batteri }}"}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_huawei_tvangsladning}
          - if: "{{ is_state('switch.min_luna_charge_from_grid', 'on') }}"
            then: [{action: switch.turn_off, target: {entity_id: switch.min_luna_charge_from_grid}}]
  - id: wattlas_huawei_afladegraense
    alias: Wattlas Huawei – afladegrænse
    description: >-
      Mens Wattlas styrer: batteriets højeste afladeeffekt efter det aktive program (0 W ved/under programmets SOC =
      gem batteriet). Første gang huskes din egen indstilling, og den sættes tilbage, når Wattlas holder op med at
      styre. Uden for styringen gives kun dine egne indstillinger tilbage (afladeeffekt og salg).
    mode: queued
    max: 5
    triggers:
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: [input_boolean.emhass_styring_aktiv, input_boolean.emhass_har_overtaget]
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_luna_state_of_capacity') | float(-1) }}"
      bund: "{{ states('input_number.wattlas_huawei_p' ~ periode ~ '_soc') | float(15) }}"
      loft: "{{ state_attr('number.min_luna_maximum_discharging_power', 'max') | float(0) }}"
      styrer: "{{ is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.emhass_har_overtaget', 'on') }}"
      nu: "{{ states('number.min_luna_maximum_discharging_power') | float(-1) }}"
      oensket: >-
        {% set p = states('input_number.wattlas_huawei_p' ~ periode ~ '_power') | float(0) %}
        {{ 0 if soc <= bund else ([p, loft] | min | round(-1) | int) }}
    conditions:
      - condition: template
        value_template: "{{ soc >= 0 and loft > 0 and nu >= 0 }}"
    actions:
      - if: "{{ styrer }}"
        then:
          - if: "{{ not is_state('input_boolean.wattlas_huawei_afladegraense_sat', 'on') }}"
            then:  # din egen indstilling huskes, før Wattlas ændrer den første gang
              - action: input_number.set_value
                target: {entity_id: input_number.wattlas_huawei_egen_afladeeffekt}
                data: {value: "{{ nu }}"}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_huawei_afladegraense_sat}
          - if: "{{ (nu - oensket) | abs > 50 }}"
            then:
              - action: number.set_value
                target: {entity_id: number.min_luna_maximum_discharging_power}
                data: {value: "{{ oensket }}"}
        else:
          - if: "{{ is_state('input_boolean.wattlas_huawei_afladegraense_sat', 'on') }}"
            then:  # Wattlas styrer ikke længere: din egen indstilling tilbage, én gang
              - action: number.set_value
                target: {entity_id: number.min_luna_maximum_discharging_power}
                data: {value: "{{ [states('input_number.wattlas_huawei_egen_afladeeffekt') | float(0), loft] | min }}"}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_huawei_afladegraense_sat}
          # stoppede Wattlas solsalget (negativ pris), må det ikke blive stående: salg tilbage til den tilladte eksport
          - if: "{{ is_state('input_boolean.wattlas_huawei_salg_stoppet', 'on') }}"
            then: [{action: switch.turn_on, continue_on_error: true, target: {entity_id: switch.wattlas_solsalg}}]

  - id: wattlas_huawei_stroemgraenser
    alias: Wattlas Huawei – strømgrænser fra effekt
    description: >-
      Kanalen regner Huawei-batteriet med 50 V, så Wattlas' strømgrænser (A) følger effekt-indstillingerne (W ÷ 50).
      Ændrer du fx maks. netladeeffekt, følger maks. netladestrøm med.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_number.wattlas_maks_ladeeffekt_w, input_number.wattlas_maks_afladeeffekt_w, input_number.wattlas_maks_netladeeffekt_w]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - {a: input_number.wattlas_maks_ladestroem_a, w: input_number.wattlas_maks_ladeeffekt_w}
            - {a: input_number.wattlas_maks_afladestroem_a, w: input_number.wattlas_maks_afladeeffekt_w}
            - {a: input_number.wattlas_maks_netladestroem_a, w: input_number.wattlas_maks_netladeeffekt_w}
          sequence:
            - if: >-
                {{ states(repeat.item.w) | float(0) > 0
                   and (states(repeat.item.a) | float(0) - (states(repeat.item.w) | float(0) / 50) | round(0)) | abs >= 1 }}
              then:
                - action: input_number.set_value
                  target: {entity_id: "{{ repeat.item.a }}"}
                  data: {value: "{{ (states(repeat.item.w) | float(0) / 50) | round(0) }}"}
