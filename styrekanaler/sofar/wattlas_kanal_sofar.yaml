# Wattlas styrekanal – Sofar HYD-hybrid (fx HYD 5–20KTL-3PH) via solax_modbus (wills106/homeassistant-solax-modbus).
# EKSPERIMENTEL: skrevet ud fra solax_modbus' egen dokumentation og kode (Apache-2.0) og prøvet i en test-Home Assistant med den
# rigtige solax_modbus mod en falsk Sofar – ikke kørt på et rigtigt anlæg. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Enheden hedder min_sofar_* (navnet på solax_modbus-forbindelsen vælges i opsætningen). Kun trefasede Sofar-hybrider med
# lokal forbindelse (Modbus TCP/RTU).
#
# Overtager Wattlas, sendes en timeout på 10 minutter med "Return to Previous Mode" til inverteren, og "Energy Storage Mode"
# sættes til "Passive Mode". Tallene fornyes hvert minut, mens Wattlas styrer. Slippes styringen – eller går Home Assistant ned –
# løber timeouten ud, og Sofar går selv tilbage til den tilstand, den stod i før (fx Self Use). Uden for styringen (og i skygge)
# skriver Wattlas intet. Din egen Passive-timeout i inverteren erstattes af de 10 minutter.
#
# Styring i Passive Mode (tre tal sendes med knappen "Passive: Update Battery Charge/Discharge"):
#   netladning = mindst den bedte effekt i batteriet (solen tæller med), højst batteriets maks.: nettet giver aldrig mere end bedt
#   gem        = batteriet må lade (af solen), ikke aflade
#   fri        = som Self Use: lade og aflade frit, mål 0 W fra nettet
# Højvoltbatteri: kernen regner i A ved et lavvoltbatteri. Kanalen bruger en fast beregningsspænding på 50 V (A × 50 = W).
#
# Sofar har ingen tidsprogrammer, Wattlas kan bruge. Kanalen husker dem selv og bruger det aktive programs værdier i
# samme perioder som kernen (1: 01–05, 2: 05–09, 3: 09–13, 4: 13–17, 5: 17–21, 6: 21–01):
#   SOC    = bundgrænse (ved eller under den gemmes batteriet) og mål ved netladning
#   effekt = 0 W gemmer batteriet; over 0 W må det aflade frit
# Solsalg fra = "FeedIn: Maximum Power" 0 W (med "FeedIn: Update"); din egen grænse huskes og sættes tilbage. Kræver, at
#   "FeedIn: Limitation Mode" allerede er slået til – ellers rører Wattlas den ikke.
input_boolean:
  wattlas_sofar_netladning:
    name: Wattlas Sofar netladning (husket)
  wattlas_sofar_fjern_styret:
    name: Wattlas Sofar har sendt egne Passive-tal
  wattlas_sofar_salg_stoppet:
    name: Wattlas Sofar har stoppet solsalget
  wattlas_sofar_p1:
    name: Wattlas Sofar netladning program 1 (husket)
  wattlas_sofar_p2:
    name: Wattlas Sofar netladning program 2 (husket)
  wattlas_sofar_p3:
    name: Wattlas Sofar netladning program 3 (husket)
  wattlas_sofar_p4:
    name: Wattlas Sofar netladning program 4 (husket)
  wattlas_sofar_p5:
    name: Wattlas Sofar netladning program 5 (husket)
  wattlas_sofar_p6:
    name: Wattlas Sofar netladning program 6 (husket)
input_number:
  wattlas_sofar_netladestroem:
    name: Wattlas Sofar netladestrøm (husket)
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: A
  wattlas_sofar_egen_eksportgraense:
    name: Wattlas Sofar – din egen eksportgrænse (husket)
    min: 0
    max: 20000
    step: 1
    unit_of_measurement: W
  wattlas_sofar_p1_soc:
    name: Wattlas Sofar program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p1_power:
    name: Wattlas Sofar program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sofar_p2_soc:
    name: Wattlas Sofar program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p2_power:
    name: Wattlas Sofar program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sofar_p3_soc:
    name: Wattlas Sofar program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p3_power:
    name: Wattlas Sofar program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sofar_p4_soc:
    name: Wattlas Sofar program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p4_power:
    name: Wattlas Sofar program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sofar_p5_soc:
    name: Wattlas Sofar program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p5_power:
    name: Wattlas Sofar program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_sofar_p6_soc:
    name: Wattlas Sofar program 6 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_sofar_p6_power:
    name: Wattlas Sofar program 6 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        state: "{{ is_state('input_boolean.wattlas_sofar_p1', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p1}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p1}}]
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
        state: "{{ is_state('input_boolean.wattlas_sofar_p2', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p2}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p2}}]
      - name: EMHASS netladning program 3
        unique_id: emhass_netladning_p3
        default_entity_id: switch.emhass_netladning_p3
        state: "{{ is_state('input_boolean.wattlas_sofar_p3', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p3}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p3}}]
      - name: EMHASS netladning program 4
        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        state: "{{ is_state('input_boolean.wattlas_sofar_p4', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p4}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
        state: "{{ is_state('input_boolean.wattlas_sofar_p5', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p5}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p5}}]
      - name: EMHASS netladning program 6
        unique_id: emhass_netladning_p6
        default_entity_id: switch.emhass_netladning_p6
        state: "{{ is_state('input_boolean.wattlas_sofar_p6', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_p6}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('select.min_sofar_energy_storage_mode') }}"
        state: "{{ is_state('input_boolean.wattlas_sofar_netladning', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_netladning}}]
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.wattlas_sofar_netladning}
          # stoppes med det samme her (automationen nedenfor gør det også), så "fra" er fra, når kernen går videre
          - if: "{{ is_state('input_boolean.wattlas_sofar_fjern_styret', 'on') and states('number.min_sofar_passive_minimum_battery_power') | float(0) > 0 }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target: {entity_id: number.min_sofar_passive_minimum_battery_power}
                data: {value: 0}
              - action: button.press
                continue_on_error: true
                target: {entity_id: button.min_sofar_passive_update_battery_charge_discharge}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: >-
          {{ is_number(states('number.min_sofar_feedin_maximum_power')) and has_value('select.min_sofar_feedin_limitation_mode')
             and not is_state('select.min_sofar_feedin_limitation_mode', 'Disabled') }}
        # "til", indtil Wattlas selv har stoppet salget – en ny installation skriver derfor intet til inverteren
        state: "{{ not is_state('input_boolean.wattlas_sofar_salg_stoppet', 'on') }}"
        turn_on:
          - if: "{{ is_state('input_boolean.wattlas_sofar_salg_stoppet', 'on') }}"
            then:
              - action: number.set_value
                target: {entity_id: number.min_sofar_feedin_maximum_power}
                data: {value: "{{ states('input_number.wattlas_sofar_egen_eksportgraense') | float(0) }}"}
              - action: button.press
                target: {entity_id: button.min_sofar_feedin_update}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_sofar_salg_stoppet}
        turn_off:
          # eksportgrænsen gemmes i inverterens hukommelse – skrives kun, når den skifter
          - if: "{{ not is_state('input_boolean.wattlas_sofar_salg_stoppet', 'on') }}"
            then:
              - action: input_number.set_value
                target: {entity_id: input_number.wattlas_sofar_egen_eksportgraense}
                data: {value: "{{ states('number.min_sofar_feedin_maximum_power') | float(0) }}"}
              - action: number.set_value
                target: {entity_id: number.min_sofar_feedin_maximum_power}
                data: {value: 0}
              - action: button.press
                target: {entity_id: button.min_sofar_feedin_update}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_sofar_salg_stoppet}
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ states('input_number.wattlas_sofar_netladestroem') | float(0) }}"
        min: 0
        max: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
        step: 1
        unit_of_measurement: A
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_netladestroem}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        state: "{{ states('input_number.wattlas_sofar_p1_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p1_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
        unique_id: wattlas_program_1_power
        default_entity_id: number.wattlas_program_1_power
        state: "{{ states('input_number.wattlas_sofar_p1_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p1_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 SOC
        unique_id: wattlas_program_2_soc
        default_entity_id: number.wattlas_program_2_soc
        state: "{{ states('input_number.wattlas_sofar_p2_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p2_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 effekt
        unique_id: wattlas_program_2_power
        default_entity_id: number.wattlas_program_2_power
        state: "{{ states('input_number.wattlas_sofar_p2_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p2_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 SOC
        unique_id: wattlas_program_3_soc
        default_entity_id: number.wattlas_program_3_soc
        state: "{{ states('input_number.wattlas_sofar_p3_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p3_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 effekt
        unique_id: wattlas_program_3_power
        default_entity_id: number.wattlas_program_3_power
        state: "{{ states('input_number.wattlas_sofar_p3_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p3_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 SOC
        unique_id: wattlas_program_4_soc
        default_entity_id: number.wattlas_program_4_soc
        state: "{{ states('input_number.wattlas_sofar_p4_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p4_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 effekt
        unique_id: wattlas_program_4_power
        default_entity_id: number.wattlas_program_4_power
        state: "{{ states('input_number.wattlas_sofar_p4_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p4_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 SOC
        unique_id: wattlas_program_5_soc
        default_entity_id: number.wattlas_program_5_soc
        state: "{{ states('input_number.wattlas_sofar_p5_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p5_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 effekt
        unique_id: wattlas_program_5_power
        default_entity_id: number.wattlas_program_5_power
        state: "{{ states('input_number.wattlas_sofar_p5_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p5_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 SOC
        unique_id: wattlas_program_6_soc
        default_entity_id: number.wattlas_program_6_soc
        state: "{{ states('input_number.wattlas_sofar_p6_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p6_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 effekt
        unique_id: wattlas_program_6_power
        default_entity_id: number.wattlas_program_6_power
        state: "{{ states('input_number.wattlas_sofar_p6_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_sofar_p6_power}, data: {value: "{{ value }}"}}]
  - sensor:
      # Sofar styres i effekt (W), ikke batteristrøm – kanalen bruger din indstilling "maks. ladeeffekt" (W ÷ 50)
      - name: Wattlas maks. ladestrøm
        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_afladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_afladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_sofar_pv_power_total')) }}"
        state: "{{ [0, states('sensor.min_sofar_pv_power_total') | float(0) * 1000] | max | round(0) }}"
      # effekter til dagstællerne (W): elmålerens tal (PCC, kW) antages positivt ved salg – se regnestykke-tjekket
      - name: Wattlas Sofar netkøb
        unique_id: wattlas_sofar_netkoeb
        default_entity_id: sensor.wattlas_sofar_netkoeb
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_sofar_active_power_pcc_total')) }}"
        state: "{{ [0, -(states('sensor.min_sofar_active_power_pcc_total') | float(0)) * 1000] | max | round(0) }}"
      - name: Wattlas Sofar solgt
        unique_id: wattlas_sofar_solgt
        default_entity_id: sensor.wattlas_sofar_solgt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_sofar_active_power_pcc_total')) }}"
        state: "{{ [0, states('sensor.min_sofar_active_power_pcc_total') | float(0) * 1000] | max | round(0) }}"
      - name: Wattlas Sofar husforbrug
        unique_id: wattlas_sofar_husforbrug
        default_entity_id: sensor.wattlas_sofar_husforbrug
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_sofar_active_power_load_sys')) }}"
        state: "{{ [0, states('sensor.min_sofar_active_power_load_sys') | float(0) * 1000] | max | round(0) }}"
      - name: Wattlas batteri ladet i dag
        unique_id: wattlas_i_dag_ladet
        default_entity_id: sensor.wattlas_i_dag_ladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sofar_battery_input_energy_today')) }}"
        state: "{{ states('sensor.min_sofar_battery_input_energy_today') | float(0) }}"
      - name: Wattlas batteri afladet i dag
        unique_id: wattlas_i_dag_afladet
        default_entity_id: sensor.wattlas_i_dag_afladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sofar_battery_output_energy_today')) }}"
        state: "{{ states('sensor.min_sofar_battery_output_energy_today') | float(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        # Sofar har ingen tidsprogrammer, Wattlas kan bruge; kanalens egne virker, når Passive Mode kan vælges
        state: "{{ has_value('select.min_sofar_energy_storage_mode') and states.button.min_sofar_passive_update_battery_charge_discharge is not none }}"
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_sofar_system_state %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_sofar_pv_power_total')) }}"

# Produktion, forbrug og købt/solgt laves her med HA's egne værktøjer ud fra effekterne (samme tal for alle Sofar-udgaver).
sensor:
  - platform: integration
    source: sensor.emhass_solproduktion_samlet
    name: wattlas_total_produktion  # navnet bliver entity_id
    unique_id: wattlas_total_produktion
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_sofar_husforbrug
    name: wattlas_total_forbrug  # navnet bliver entity_id
    unique_id: wattlas_total_forbrug
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_sofar_netkoeb
    name: wattlas_total_koebt  # navnet bliver entity_id
    unique_id: wattlas_total_koebt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_sofar_solgt
    name: wattlas_total_solgt  # navnet bliver entity_id
    unique_id: wattlas_total_solgt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
utility_meter:
  wattlas_i_dag_produktion:
    unique_id: wattlas_i_dag_produktion
