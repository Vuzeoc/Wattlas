automation:
  - id: wattlas_sofar_styring
    alias: Wattlas Sofar – styring
    description: >-
      Det eneste sted, Wattlas styrer Sofar. Mens Wattlas styrer, står inverteren i Passive Mode, og tre tal (net-mål, mindste og
      største batterieffekt) sendes hvert minut, så timeouten ikke løber ud: netladning (mindst den bedte effekt, kun op til det
      aktive programs SOC), gem (ingen afladning) eller fri (som Self Use). Slippes styringen, sendes "fri" én gang, et stoppet
      solsalg gives tilbage, og Sofars timeout går selv tilbage til den tidligere tilstand.
    # en ny ordre afbryder den gamle: en kø ville kunne sende en forældet ladeordre, efter at ladningen er stoppet
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_boolean.wattlas_sofar_netladning, input_number.wattlas_sofar_netladestroem,
                    input_boolean.emhass_styring_aktiv, input_boolean.emhass_har_overtaget]
      - trigger: state
        entity_id: [input_boolean.wattlas_sofar_p1, input_boolean.wattlas_sofar_p2, input_boolean.wattlas_sofar_p3,
                    input_boolean.wattlas_sofar_p4, input_boolean.wattlas_sofar_p5, input_boolean.wattlas_sofar_p6]
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_sofar_battery_capacity_total') | float(-1) }}"
      maal: "{{ states('input_number.wattlas_sofar_p' ~ periode ~ '_soc') | float(0) }}"
      effekt: "{{ states('input_number.wattlas_sofar_p' ~ periode ~ '_power') | float(0) }}"
      # solax_modbus tager højst 20000 W
      loft: "{{ [states('input_number.wattlas_maks_ladeeffekt_w') | float(0), 20000] | min }}"
      aflad: "{{ [states('input_number.wattlas_maks_afladeeffekt_w') | float(0), 20000] | min }}"
      # effekten fra nettet i hele 100 W, aldrig over loftet
      watt: "{{ ([states('input_number.wattlas_sofar_netladestroem') | float(0) * 50, loft] | min / 100) | round(0, 'floor') * 100 }}"
      styrer: "{{ is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.emhass_har_overtaget', 'on') }}"
      tilstand: >-
        {% if styrer and is_state('input_boolean.wattlas_sofar_netladning', 'on')
              and is_state('input_boolean.wattlas_sofar_p' ~ periode, 'on') and watt >= 100 and 0 <= soc < maal %}lad
        {% elif styrer and (soc <= maal or effekt < 50) %}gem
        {% else %}fri{% endif %}
      # [net-mål, mindste, største batterieffekt] (W, positiv = ladning)
      tal: "{{ [0, watt, loft] if tilstand == 'lad' else [0, 0, loft] if tilstand == 'gem' else [0, -aflad, loft] }}"
    conditions:
      # solax_modbus skal være klar (ved opstart kan Wattlas komme før inverteren)
      - condition: template
        value_template: >-
          {{ has_value('select.min_sofar_energy_storage_mode') and loft > 0 and aflad > 0 and soc >= 0
             and states.button.min_sofar_passive_update_battery_charge_discharge is not none
             and states.button.min_sofar_passive_update_timeout is not none }}
    actions:
      - variables:
          overtag: "{{ styrer and not is_state('select.min_sofar_energy_storage_mode', 'Passive Mode') }}"
          sendes: "{{ tal if styrer else [0, -aflad, loft] }}"
      - if: "{{ styrer or is_state('input_boolean.wattlas_sofar_fjern_styret', 'on') }}"
        then:
          # flaget først: afbrydes kørslen midt i, giver den næste inverteren tilbage
          - if: "{{ styrer }}"
            then: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_sofar_fjern_styret}}]
          # tal og valg ligger kun i solax_modbus, til knappen sender dem – og de erstattes af inverterens egne ved næste aflæsning,
          # uden at visningen følger med. Derfor sættes de altid lige før knappen (største først, så mindste aldrig er over største)
          - action: number.set_value
            target: {entity_id: number.min_sofar_passive_maximum_battery_power}
            data: {value: "{{ sendes[2] }}"}
          - action: number.set_value
            target: {entity_id: number.min_sofar_passive_minimum_battery_power}
            data: {value: "{{ sendes[1] }}"}
          - action: number.set_value
            target: {entity_id: number.min_sofar_passive_desired_grid_power}
            data: {value: "{{ sendes[0] }}"}
          # timeouten: ved hver overtagelse (knappens tilstand er sidste tryk; flaget skiftede ved overtagelsen – så en afbrudt kørsel
          # sender den igen), og ellers én gang i timen. Ikke hvert minut: den kan være gemt i inverterens hukommelse
          - if: >-
              {% set p = as_timestamp(states('button.min_sofar_passive_update_timeout'), 0) %}
              {{ styrer and (overtag or p < as_timestamp(states.input_boolean.wattlas_sofar_fjern_styret.last_changed, 0)
                 or as_timestamp(now()) - p > 3600) }}
            then:
              - action: select.select_option
                target: {entity_id: select.min_sofar_passive_timeout}
                data: {option: 10 Minutes}
              - action: select.select_option
                target: {entity_id: select.min_sofar_passive_timeout_action}
                data: {option: Return to Previous Mode}
              - action: button.press
                target: {entity_id: button.min_sofar_passive_update_timeout}
          - action: button.press
            target: {entity_id: button.min_sofar_passive_update_battery_charge_discharge}
          # først nu: så kører inverteren aldrig på gamle Passive-tal eller uden timeout
          - if: "{{ overtag }}"
            then: [{action: select.select_option, target: {entity_id: select.min_sofar_energy_storage_mode}, data: {option: Passive Mode}}]
          - if: "{{ not styrer }}"
            then: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_sofar_fjern_styret}}]
      # stoppede Wattlas solsalget (negativ pris), må det ikke blive stående: din egen eksportgrænse tilbage
      - if: "{{ not styrer and is_state('input_boolean.wattlas_sofar_salg_stoppet', 'on') }}"
        then: [{action: switch.turn_on, continue_on_error: true, target: {entity_id: switch.wattlas_solsalg}}]

  - id: wattlas_sofar_stroemgraenser
    alias: Wattlas Sofar – strømgrænser fra effekt
    description: >-
      Kanalen regner Sofar-batteriet med 50 V, så Wattlas' strømgrænser (A) følger effekt-indstillingerne (W ÷ 50).
      Ændrer du fx maks. netladeeffekt, følger maks. netladestrøm med.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_number.wattlas_maks_ladeeffekt_w, input_number.wattlas_maks_afladeeffekt_w, input_number.wattlas_maks_netladeeffekt_w]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - {a: input_number.wattlas_maks_ladestroem_a, w: input_number.wattlas_maks_ladeeffekt_w}
            - {a: input_number.wattlas_maks_afladestroem_a, w: input_number.wattlas_maks_afladeeffekt_w}
            - {a: input_number.wattlas_maks_netladestroem_a, w: input_number.wattlas_maks_netladeeffekt_w}
          sequence:
            - if: >-
                {{ states(repeat.item.w) | float(0) > 0
                   and (states(repeat.item.a) | float(0) - (states(repeat.item.w) | float(0) / 50) | round(0)) | abs >= 1 }}
              then:
                - action: input_number.set_value
                  target: {entity_id: "{{ repeat.item.a }}"}
                  data: {value: "{{ (states(repeat.item.w) | float(0) / 50) | round(0) }}"}
