  binary_sensor:
  - name: EMHASS styrekanal (Sofar)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['number.min_sofar_passive_minimum_battery_power','number.min_sofar_passive_maximum_battery_power','number.min_sofar_passive_desired_grid_power','select.min_sofar_passive_timeout','select.min_sofar_passive_timeout_action'] %}
       {# solax_modbus' lokale tal er "unknown", til de er skrevet første gang – de skal bare findes #}
       {% if states[e] is none or is_state(e, 'unavailable') %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.wattlas_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','sofar_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=90
       and has_value('select.min_sofar_energy_storage_mode') and states.button.min_sofar_passive_update_timeout is not none
       and states.button.min_sofar_passive_update_battery_charge_discharge is not none
       and states('input_number.wattlas_maks_ladeeffekt_w')|float(0) > 0 }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: >-
        Sofar-styrekanalen er ikke klar – målinger mangler eller er gamle, regnestykket mellem sol, batteri, net og
        husforbrug passer ikke (fortegn), eller "Energy Storage Mode" og Passive-entiteterne mangler i solax_modbus. Netopladning er forsøgt stoppet; faktisk inverterdrift skal kontrolleres.
