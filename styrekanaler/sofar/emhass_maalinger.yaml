# Wattlas styrekanal – Sofar: målinger fra solax_modbus (Sofar HYD trefaset; enheden min_sofar_*). Sofar melder effekter i kW.
# Fortegn (ANTAGET – ikke dokumenteret i solax_modbus): elmålerens effekt (Active Power PCC) positiv ved salg, batteriets
# (Battery Power Total) positiv ved ladning. Til kernen: net og fasetal positive ved køb, batteri positivt ved afladning.
# Regnestykke-tjek: sol + afladning + køb skal give husets forbrug (Active Power Load Sys), og faserne skal summe til
# totalen. Passer det ikke i 2 minutter (fx et forkert fortegn), bruges målingerne ikke, og Wattlas styrer ikke.
# Batterispændingen er kanalens faste beregningsspænding på 50 V (højvoltbatteri, se wattlas_kanal_sofar.yaml).
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      sample: |-
        {% set t = as_timestamp(now()) %}
        {% set status = states('sensor.min_sofar_system_state') %}
        {% set net = -(states('sensor.min_sofar_active_power_pcc_total') | float(0)) * 1000 %}
        {% set load = states('sensor.min_sofar_active_power_load_sys') | float(0) * 1000 %}
        {% set ladning = states('sensor.min_sofar_battery_power_total') | float(0) * 1000 %}
        {% set pv = states('sensor.min_sofar_pv_power_total') | float(0) * 1000 %}
        {% set faser = [states('sensor.min_sofar_active_power_pcc_l1') | float(0), states('sensor.min_sofar_active_power_pcc_l2') | float(0),
                        states('sensor.min_sofar_active_power_pcc_l3') | float(0)] %}
        {% set m = dict(
          load_w_totalpower = load | round(0),
          grid_out_total_power = net | round(0),
          battery_output_w_power = -ladning | round(0),
          battery_soc = states('sensor.min_sofar_battery_capacity_total'),
          battery_voltage = 50,
          inverter_status = 'Normal' if status in ['Grid-connected', 'Self-Charging'] else status,
          battery_temperature = states('sensor.min_sofar_battery_temperature_1'),
          inverter_temperature = states('sensor.min_sofar_inverter_temperature_1'),
          external_ct_w_l1 = (-faser[0] * 1000) | round(0),
          external_ct_w_l2 = (-faser[1] * 1000) | round(0),
          external_ct_w_l3 = (-faser[2] * 1000) | round(0),
          grid_current_v_l1 = states('sensor.min_sofar_voltage_l1'),
          grid_current_v_l2 = states('sensor.min_sofar_voltage_l2'),
          grid_current_v_l3 = states('sensor.min_sofar_voltage_l3')) %}
        {% set kilder = ['sensor.min_sofar_active_power_pcc_total', 'sensor.min_sofar_active_power_load_sys', 'sensor.min_sofar_battery_power_total',
                         'sensor.min_sofar_battery_capacity_total', 'sensor.min_sofar_pv_power_total',
                         'sensor.min_sofar_active_power_pcc_l1', 'sensor.min_sofar_active_power_pcc_l2', 'sensor.min_sofar_active_power_pcc_l3',
                         'sensor.min_sofar_voltage_l1', 'sensor.min_sofar_voltage_l2', 'sensor.min_sofar_voltage_l3'] %}
        {% set ns = namespace(ok=has_value('sensor.min_sofar_system_state'), aeldst=t) %}
        {% for e in kilder %}
          {% set s = states[e] %}
          {% if s is none or not is_number(s.state) %}{% set ns.ok = false %}
          {% else %}{% set ns.aeldst = [ns.aeldst, as_timestamp(s.last_reported, 0)] | min %}{% endif %}
        {% endfor %}
        {# Regnestykket (batteriet meldes kun i hele 100 W, og målingerne læses ikke samtidig – derfor rummelige grænser) #}
        {% set afvig = (pv - ladning + net - load) | abs %}
        {% set fase_afvig = ((faser | sum) * 1000 + net) | abs %}
        {% set balance_ok = afvig <= [600, load * 0.15] | max and fase_afvig <= 500 %}
        {% set fejl_siden = 0 if balance_ok else (state_attr('sensor.emhass_maalekilde', 'balance_fejl_siden') | float(0) or t) %}
        {% set ok = ns.ok and (balance_ok or t - fejl_siden < 120) and 0 <= t - ns.aeldst <= 90 %}
        {% set tider = namespace(d={}) %}
        {% for k in m %}{% set tider.d = dict(tider.d, **{k: ns.aeldst}) %}{% endfor %}
        {{ dict(source=('Sofar' if ok else 'Ingen'), values=(m if ok else {}), times=(tider.d if ok else {}), sofar_ok=ok,
                balance_ok=balance_ok, balance_fejl_siden=fejl_siden, afvigelse_w=afvig | round(0), fase_afvigelse_w=fase_afvig | round(0), time=t) }}
  sensor:
  - name: EMHASS målekilde
    unique_id: emhass_maalekilde
    default_entity_id: sensor.emhass_maalekilde
    state: '{{ sample.source }}'
    attributes:
      values: '{{ sample[''values''] }}'
      raw_reported: '{{ sample[''times''] }}'
      sofar_ok: '{{ sample[''sofar_ok''] }}'
      balance_ok: '{{ sample[''balance_ok''] }}'
      balance_fejl_siden: '{{ sample[''balance_fejl_siden''] }}'
      afvigelse_w: '{{ sample[''afvigelse_w''] }}'
      fase_afvigelse_w: '{{ sample[''fase_afvigelse_w''] }}'
      sample_time: '{{ sample[''time''] }}'
- sensor:
  - name: EMHASS måling load_w_totalpower
    unique_id: emhass_m_load_w_totalpower
    default_entity_id: sensor.emhass_m_load_w_totalpower
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Sofar''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''load_w_totalpower'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: EMHASS måling grid_out_total_power
