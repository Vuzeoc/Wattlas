  binary_sensor:
  - name: EMHASS styrekanal (Huawei)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['number.min_luna_maximum_charging_power','number.min_luna_maximum_discharging_power'] %}
       {% if not is_number(states(e)) or not is_number(state_attr(e,'max')) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.wattlas_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','huawei_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=90
       and has_value('sensor.min_huawei_device_status')
       and has_value('switch.min_luna_charge_from_grid')
       and states('select.min_emma_ess_control_mode') in ['maximum_self_consumption', 'third_party_dispatch']
       and device_id('sensor.min_luna_state_of_capacity') is not none
       and device_id('sensor.min_huawei_input_power') is not none }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: Huawei-styrekanalen er ikke klar – målinger, skriveadgang (Huawei Solar med elevate permissions),
        batteriets indstillinger mangler, EMMA's ESS Control Mode er forkert, eller regnestykket mellem sol, batteri,
        salg og husforbrug passer ikke (fortegn). Netopladning er forsøgt stoppet; faktisk inverterdrift skal kontrolleres.
