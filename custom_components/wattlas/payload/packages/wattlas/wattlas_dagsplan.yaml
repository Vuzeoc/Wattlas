# Wattlas – plan mod virkelighed: kl. 23:50 gemmes planen for næste døgn (sol, forbrug inkl. fleksibel forbruger og elbil, net og priser pr. halve
# time, med tiden som Unix-sekunder), så app-kortet dagen efter kan holde den op mod det, der blev målt. Den forrige gemmes også, så "i går" altid findes.
# shortcut: kører HA ikke kl. 23:50, mangler den dag; et ekstra gem ved start ville gemme en plan, der allerede kender en del af dagen.
template:
  - triggers:
      - trigger: time
        at: "23:50:00"
    sensor:
      - name: Wattlas dagsplan
        unique_id: wattlas_dagsplan
        default_entity_id: sensor.wattlas_dagsplan
        icon: mdi:calendar-check-outline
        state: "{{ (now() + timedelta(days=1)).date() | string }}"
        attributes:
          forrige_dag: "{{ this.state if this.state not in ['unknown', 'unavailable'] else none }}"
          forrige: "{{ this.attributes.get('plan') }}"
          plan: >-
            {% set d = (now() + timedelta(days=1)).date() | string %}
            {% set ns = namespace(r=[]) %}
            {# en last, der er udeladt af den seneste plan, publiceres ikke og står på sin gamle plan: kun serier fra samme publicering #}
            {% macro serie(id, attr, key) %}{% set s, pv = states[id], states['sensor.p_pv_forecast'] %}
              {%- set l = (s.attributes.get(attr) or []) if s is not none and pv is not none and (as_timestamp(pv.last_reported) - as_timestamp(s.last_reported)) | abs < 720 else [] -%}
              {{ dict(zip(l | map(attribute='date') | map('string') | list, l | map(attribute=key) | list)) | to_json }}{% endmacro %}
            {% set L = serie('sensor.p_load_forecast', 'forecasts', 'p_load_forecast') | from_json %}
            {% set D0 = serie('sensor.' ~ 'p_deferrable0', 'deferrables_schedule', 'p_deferrable0') | from_json %}
            {% set D1 = serie('sensor.' ~ 'wattlas_lader_plan', 'deferrables_schedule', 'wattlas_lader_plan') | from_json %}
            {% set G = serie('sensor.p_grid_forecast', 'forecasts', 'p_grid_forecast') | from_json %}
            {% set K = serie('sensor.unit_load_cost', 'unit_load_cost_forecasts', 'unit_load_cost') | from_json %}
            {% set S = serie('sensor.unit_prod_price', 'unit_prod_price_forecasts', 'unit_prod_price') | from_json %}
            {% for x in state_attr('sensor.p_pv_forecast', 'forecasts') or [] if (x.date | string)[:10] == d %}
              {% set t = x.date | string %}
              {# tid som Unix-sekunder, ikke "HH:MM": ved vintertid findes kl. 02 to gange #}
              {% set ns.r = ns.r + [[as_timestamp(x.date) | int, x.p_pv_forecast | float(0) | round(0), (L.get(t, 0) | float(0) + D0.get(t, 0) | float(0) + D1.get(t, 0) | float(0)) | round(0),
                                    G.get(t, 0) | float(0) | round(0), K.get(t, 0) | float(0) | round(3), S.get(t, 0) | float(0) | round(3)]] %}
            {% endfor %}
            {{ ns.r }}
