# Wattlas – fleksibel forbruger: tænd/sluk kontakten efter EMHASS' plan (sensor.p_deferrable0) – men kun, når der er plads på faserne.
# Egne felter (effekt, timer, kontakt …) står i wattlas_styring.yaml.
# Fasevagten er et værn oven på apparatets egen sikring, ikke i stedet for den: Wattlas ser målingerne hvert 30. sekund.
input_number:
  wattlas_forbruger1_faser:
    name: Wattlas · fleksibel forbruger antal faser
    min: 1
    max: 3
    step: 2
    icon: mdi:sine-wave
  # plads, som netladningen skal holde fri, mens forbrugeren venter på at starte (trefaset W; 0 = ingen). Sættes kun af automationen nedenfor
  wattlas_forbruger1_reserve:
    name: Wattlas · fleksibel forbruger venter på plads
    min: 0
    max: 100000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: W

template:
  - binary_sensor:
      # Hovedsikringen er overskredet, mens forbrugeren kører. Netladningen viger først (inden for 30 s) – er det ikke nok efter et minut,
      # slukkes forbrugeren. Er hovedsikringen ikke sat, gælder fasegrænsen og importloftet.
      - name: Wattlas forbruger overbelaster
        unique_id: wattlas_forbruger1_overbelaster
        default_entity_id: binary_sensor.wattlas_forbruger1_overbelaster
        device_class: problem
        delay_on:
          seconds: 60
        state: >-
          {% set g = states('input_number.wattlas_fase_graense_a') | float(0) %}{% set sik = [states('input_number.wattlas_sikring_a') | float(0), g] | max %}
          {% set ns = namespace(over=states('sensor.emhass_m_grid_out_total_power') | float(0) > states('input_number.wattlas_import_graense_w') | float(0) * (sik / g if g > 0 else 1)) %}
          {% for i in range(1, 4) %}
            {% if states('sensor.emhass_m_external_ct_w_l' ~ i) | float(0) > sik * states('sensor.emhass_m_grid_current_v_l' ~ i) | float(230) %}{% set ns.over = true %}{% endif %}
          {% endfor %}
          {{ is_state('input_boolean.wattlas_forbruger1_aktiv', 'on') and is_state('binary_sensor.emhass_ui_data_frisk', 'on')
             and is_state(states('input_text.wattlas_forbruger1_entitet'), 'on') and ns.over }}
      # Over reguleringsgrænsen, men under hovedsikringen: det tåler en sikring længe. Først efter 10 minutter slukkes forbrugeren.
      - name: Wattlas forbruger over reguleringsgrænsen
        unique_id: wattlas_forbruger1_over_regulering
        default_entity_id: binary_sensor.wattlas_forbruger1_over_regulering
        device_class: problem
        delay_on:
          minutes: 10
        state: >-
          {% set g = states('input_number.wattlas_fase_graense_a') | float(0) %}
          {% set ns = namespace(over=states('sensor.emhass_m_grid_out_total_power') | float(0) > states('input_number.wattlas_import_graense_w') | float(0)) %}
          {% for i in range(1, 4) %}
            {% if states('sensor.emhass_m_external_ct_w_l' ~ i) | float(0) > g * states('sensor.emhass_m_grid_current_v_l' ~ i) | float(230) %}{% set ns.over = true %}{% endif %}
          {% endfor %}
          {{ states('input_number.wattlas_sikring_a') | float(0) > g and is_state('input_boolean.wattlas_forbruger1_aktiv', 'on')
             and is_state('binary_sensor.emhass_ui_data_frisk', 'on') and is_state(states('input_text.wattlas_forbruger1_entitet'), 'on') and ns.over }}

automation:
  # Slukket, når planen ikke er frisk. Tændes kun med friske målinger og plads på hver fase.
  - id: wattlas_forbruger1_styring
    alias: Wattlas · fleksibel forbruger følger planen
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: /30
    conditions:
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.wattlas_forbruger1_aktiv', 'on') or states('input_number.wattlas_forbruger1_reserve') | float(0) > 0 }}
      - condition: template
        value_template: >-
          {{ states('input_text.wattlas_forbruger1_entitet') | regex_match('^(switch|light|input_boolean)[.][a-z0-9_]+$') }}
    actions:
      - variables:
          ent: "{{ states('input_text.wattlas_forbruger1_entitet') }}"
          aktiv: "{{ is_state('input_boolean.wattlas_forbruger1_aktiv', 'on') }}"
          koerer: "{{ is_state(ent, 'on') }}"
          tilbage: "{{ states('input_number.wattlas_forbruger1_timer') | float(0) - states('input_number.wattlas_forbruger1_koert') | float(0) }}"
          # planens egen alder (ikke plan_frisk, som blinker ved hvert halvtimeskift): udelades forbrugeren, publiceres sensoren ikke og ville stå på det gamle
          # (navnet deles, så Spook ikke melder en ukendt entitet – sensoren findes først, når forbrugeren er slået til)
          oensket: >-
            {% set plan = states['sensor.' ~ 'p_deferrable0'] %}
            {{ aktiv and is_state('input_boolean.emhass_styring_aktiv', 'on') and not is_state('binary_sensor.emhass_ui_planfejl', 'on')
               and plan is not none and (now() - plan.last_reported).total_seconds() < 720 and plan.state | float(0) > 50 and tilbage | float(0) > 0 }}
          # mere, end én fase kan bære, kan kun være trefaset
          p_fase: >-
            {% set p = states('input_number.wattlas_forbruger1_effekt') | float(0) %}
            {{ p / (3 if states('input_number.wattlas_forbruger1_faser') | float(1) >= 3 or p > states('input_number.wattlas_fase_graense_a') | float(0) * 230 else 1) }}
          # plads på den værste fase (forbrugerens faser kendes ikke) og under importloftet
          plads: >-
            {% set ns = namespace(ok=is_state('binary_sensor.emhass_ui_data_frisk', 'on') and states('sensor.emhass_m_grid_out_total_power') | float(99999)
               + states('input_number.wattlas_forbruger1_effekt') | float(0) <= states('input_number.wattlas_import_graense_w') | float(0)) %}
            {% for i in range(1, 4) %}
              {% if states('sensor.emhass_m_external_ct_w_l' ~ i) | float(99999) + p_fase | float
                 > states('input_number.wattlas_fase_graense_a') | float(0) * states('sensor.emhass_m_grid_current_v_l' ~ i) | float(0) %}{% set ns.ok = false %}{% endif %}
            {% endfor %}{{ ns.ok }}
          # 10 min. pause efter hver slukning, så en kontakt eller lader ikke klapper
          hvilet: "{{ states[ent] is not none and (now() - states[ent].last_changed).total_seconds() >= 600 }}"
      - if:
          - condition: template
            value_template: "{{ oensket and not koerer and plads and hvilet }}"
        then:
          - action: homeassistant.turn_on
            target: {entity_id: "{{ ent }}"}
      # manglende målinger slukker først efter to minutter (datafejl), så et kort udfald ikke får kontakten til at klappe
      - if:
          - condition: template
            value_template: >-
              {{ aktiv and koerer and (not oensket or is_state('binary_sensor.emhass_ui_datafejl', 'on') or is_state('binary_sensor.wattlas_forbruger1_overbelaster', 'on')
                 or is_state('binary_sensor.wattlas_forbruger1_over_regulering', 'on')) }}
        then:
          - action: homeassistant.turn_off
            target: {entity_id: "{{ ent }}"}
          - if:
              - condition: state
                entity_id: [binary_sensor.wattlas_forbruger1_overbelaster, binary_sensor.wattlas_forbruger1_over_regulering]
                match: any
                state: "on"
            then:
              - action: logbook.log
                data: {name: Wattlas, entity_id: input_boolean.wattlas_forbruger1_aktiv, message: fleksibel forbruger slukket – der var for lidt plads på faserne eller under importloftet}
      # mangler der plads, viger netladningen – men kun, hvis det er nok (emhass_reguler læser reserven, højst i 5 min.)
      - variables:
          reserve: >-
            {% set overskud = [0, states('sensor.emhass_solproduktion_samlet') | float(0) - states('sensor.emhass_m_load_w_totalpower') | float(0)] | max %}
            {% set lader = [0, -(states('sensor.emhass_m_battery_output_w_power') | float(0)) / 0.95 - overskud] | max if is_state('switch.wattlas_netladning', 'on') else 0 %}
            {% set ns = namespace(ok=states('sensor.emhass_m_grid_out_total_power') | float(99999) - lader
               + states('input_number.wattlas_forbruger1_effekt') | float(0) <= states('input_number.wattlas_import_graense_w') | float(0)) %}
            {% for i in range(1, 4) %}
              {% if states('sensor.emhass_m_external_ct_w_l' ~ i) | float(99999) - lader / 3 + p_fase | float
                 > states('input_number.wattlas_fase_graense_a') | float(0) * states('sensor.emhass_m_grid_current_v_l' ~ i) | float(0) %}{% set ns.ok = false %}{% endif %}
            {% endfor %}
            {{ (3 * p_fase | float) | round(0) if oensket and not koerer and hvilet and ns.ok else 0 }}
      - if:
          - condition: template
            value_template: "{{ states('input_number.wattlas_forbruger1_reserve') | float(0) != reserve | float }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.wattlas_forbruger1_reserve}
            data: {value: "{{ reserve }}"}
      - if:
          - condition: template
            value_template: "{{ aktiv and is_state(ent, 'on') }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.wattlas_forbruger1_koert}
            data: {value: "{{ [24, states('input_number.wattlas_forbruger1_koert') | float(0) + 1 / 120] | min | round(4) }}"}
