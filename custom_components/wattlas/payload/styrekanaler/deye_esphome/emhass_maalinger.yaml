# reservekilden for målingerne er ESPHome (min_inverter_* = klatremis' navne) i stedet for SunMate; attributterne hedder solarman_ok/solarman_heartbeat.
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      mapping:
        load_w_totalpower: load_power
        grid_out_total_power: grid_power
        battery_output_w_power: battery_power
        battery_soc: battery_state_of_charge
        battery_voltage: battery_voltage
        inverter_status: run_state
        battery_temperature: battery_temperature
        inverter_temperature: heatsink_temperature
        external_ct_w_l1: external_ct_power_l1
        grid_current_v_l1: grid_voltage_l1
        external_ct_w_l2: external_ct_power_l2
        grid_current_v_l2: grid_voltage_l2
        external_ct_w_l3: external_ct_power_l3
        grid_current_v_l3: grid_voltage_l3
      smap:
        load_w_totalpower: sensor.min_inverter_load_totalpower
        grid_out_total_power: sensor.min_inverter_total_grid_power
        battery_output_w_power: sensor.min_inverter_battery_output_power
        battery_soc: sensor.min_inverter_battery_capacity
        battery_voltage: sensor.min_inverter_battery_voltage
        inverter_status: sensor.min_inverter_running_status
        battery_temperature: sensor.min_inverter_battery_temperature
        inverter_temperature: sensor.min_inverter_heat_sink_temperature
        external_ct_w_l1: sensor.min_inverter_external_ct_l1_power
        grid_current_v_l1: sensor.min_inverter_grid_voltage_l1
        external_ct_w_l2: sensor.min_inverter_external_ct_l2_power
        grid_current_v_l2: sensor.min_inverter_grid_voltage_l2
        external_ct_w_l3: sensor.min_inverter_external_ct_l3_power
        grid_current_v_l3: sensor.min_inverter_grid_voltage_l3
      required:
      - load_w_totalpower
      - grid_out_total_power
      - external_ct_w_l1
      - external_ct_w_l2
      - external_ct_w_l3
      - grid_current_v_l1
      - grid_current_v_l2
      - grid_current_v_l3
      - battery_output_w_power
      - battery_soc
      - battery_voltage
      fast:
      - load_w_totalpower
      - grid_out_total_power
      - external_ct_w_l1
      - external_ct_w_l2
      - external_ct_w_l3
      - grid_current_v_l1
      - grid_current_v_l2
      - grid_current_v_l3
  - variables:
      sample: |-
        {% set t=as_timestamp(now()) %}
        {% set ns=namespace(d=true,s=true,dh=0,sh=0,values_d={},values_s={},times_d={},times_s={}) %}
        {% for k,v in mapping.items() %}
         {% set di='sensor.deye_home_monitor_'~v %}{% set si=smap[k] %}
         {% set de=states[di] %}{% set se=states[si] %}
         {% set dt=as_timestamp(de.last_reported,0) if de is defined and de is not none else 0 %}
         {% set st=as_timestamp(se.last_reported,0) if se is defined and se is not none else 0 %}
         {% set ns.values_d=dict(ns.values_d,**{k:states(di)}) %}{% set ns.values_s=dict(ns.values_s,**{k:(states(si)|capitalize if k=='inverter_status' else (states(si)|float(0) + states('sensor.min_inverter_out_of_grid_total_power')|float(0)) if k=='load_w_totalpower' and is_number(states(si)) else states(si))}) %}
         {% set ns.times_d=dict(ns.times_d,**{k:dt}) %}{% set ns.times_s=dict(ns.times_s,**{k:st}) %}
         {% if k in required %}
          {% if not is_number(states(di)) %}{% set ns.d=false %}{% endif %}
          {% if not is_number(states(si)) %}{% set ns.s=false %}{% endif %}
         {% endif %}
         {% if k in fast %}
          {% if is_number(states(di)) %}{% set ns.dh=[ns.dh,dt]|max %}{% endif %}
          {% if is_number(states(si)) %}{% set ns.sh=[ns.sh,st]|max %}{% endif %}
          {% if not 0<=t-st<=90 %}{% set ns.s=false %}{% endif %}
          {% if not 0<=t-dt<=90 %}{% set ns.d=false %}{% endif %}
         {% endif %}
        {% endfor %}
        {% set ns.d=ns.d and has_value('sensor.deye_home_monitor_run_state') and 0<=t-ns.dh<=90 %}
        {% set ns.s=ns.s and has_value('sensor.min_inverter_running_status') and 0<=t-ns.sh<=90 %}
        {% set old=state_attr('sensor.emhass_maalekilde','deye_siden')|float(0) %}
        {% set since=(old if old>0 and old<=t and trigger.platform!='homeassistant' else t) if ns.d else 0 %}
        {% set chosen='Deye' if ns.d and (t-since>=60 or not ns.s) else 'ESPHome' if ns.s else 'Ingen' %}
        {# fortegn: husforbruget kan ikke være negativt – en omvendt strømtang ser sådan ud (især under netladning). Kilden afvises efter 2 min #}
        {% set lv=((ns.values_d if chosen=='Deye' else ns.values_s).get('load_w_totalpower')|float(0)) if chosen!='Ingen' else 0 %}
        {% set gl_fejl=state_attr('sensor.emhass_maalekilde','fortegn_fejl_siden')|float(0) %}{% set gl_neg=state_attr('sensor.emhass_maalekilde','fortegn_sidst')|float(0) %}
        {% set sidst=t if lv<-200 else gl_neg %}
        {% set fejl_siden=(gl_fejl or t) if lv<-200 else (gl_fejl if gl_fejl and t-sidst<900 else 0) %}
        {% set chosen='Ingen' if fejl_siden and t-fejl_siden>=120 else chosen %}
        {{ dict(source=chosen,values=ns.values_d if chosen=='Deye' else ns.values_s if chosen=='ESPHome' else {},
         times=ns.times_d if chosen=='Deye' else ns.times_s if chosen=='ESPHome' else {},
         fortegn_fejl_siden=fejl_siden,fortegn_sidst=sidst,deye_ok=ns.d,solarman_ok=ns.s,deye_siden=since,solarman_heartbeat=ns.sh,time=t) }}
  sensor:
  - name: EMHASS målekilde
    unique_id: emhass_maalekilde
    default_entity_id: sensor.emhass_maalekilde
    state: '{{ sample.source }}'
    attributes:
      values: '{{ sample[''values''] }}'
      raw_reported: '{{ sample[''times''] }}'
      fortegn_fejl_siden: '{{ sample[''fortegn_fejl_siden''] }}'
      fortegn_sidst: '{{ sample[''fortegn_sidst''] }}'
      deye_ok: '{{ sample[''deye_ok''] }}'
      solarman_ok: '{{ sample[''solarman_ok''] }}'
      deye_siden: '{{ sample[''deye_siden''] }}'
      solarman_heartbeat: '{{ sample[''solarman_heartbeat''] }}'
      sample_time: '{{ sample[''time''] }}'
- sensor:
  - name: EMHASS måling load_w_totalpower
    unique_id: emhass_m_load_w_totalpower
    default_entity_id: sensor.emhass_m_load_w_totalpower
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Deye'',''ESPHome''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''load_w_totalpower'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
