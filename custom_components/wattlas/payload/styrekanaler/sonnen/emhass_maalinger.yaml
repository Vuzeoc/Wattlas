      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''grid_current_v_l3'',0)
        }}'
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  binary_sensor:
  - name: EMHASS Sonnen styrekanal
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% if not has_value('sensor.min_sonnen_status') %}{% set ns.ok=false %}{% endif %}
      {% if not is_number(state_attr('sensor.min_sonnen_status','OperatingMode')) %}{% set ns.ok=false %}{% endif %}
      {% for s in ['min_sonnen_maaler_w_l1','min_sonnen_maaler_w_l2','min_sonnen_maaler_w_l3',
                   'min_sonnen_maaler_v_l1','min_sonnen_maaler_v_l2','min_sonnen_maaler_v_l3'] %}
        {% if not is_number(states('sensor.'~s)) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% if not has_value('switch.wattlas_netladning') %}{% set ns.ok=false %}{% endif %}
      {% if not is_number(states('number.wattlas_netladestroem')) %}{% set ns.ok=false %}{% endif %}
      {% for i in range(1,7) %}
        {% if not is_number(states('number.wattlas_program_'~i~'_soc'))
           or not is_number(states('number.wattlas_program_'~i~'_power'))
           or not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','sonnen_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=25 }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: Sonnen-styrekanalen er ikke klar. Kontrollér at batteriet svarer, at "JSON API for Writing"
        er slået til i Software-Integration, og at tokenet virker. Netopladning er forsøgt stoppet; faktisk
        batteridrift skal kontrolleres i batteriets eget dashboard.
