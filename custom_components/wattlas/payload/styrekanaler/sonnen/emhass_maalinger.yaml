# Wattlas styrekanal – SonnenBatterie: målinger fra batteriets lokale API v2.
# Alle værdier læses med REST-sensorer (status, batterimåler, batteri, inverter og konfiguration) og
# samles i sensor.emhass_maalekilde med alderstjek, ligesom de andre kanaler gør.
# Fortegn: net positiv = køb (Sonnens GridFeedIn_W er negativ ved køb), batteri positiv = afladning
# (Pac_total_W er allerede positiv ved afladning).
# Per-fase: batteriet kan ikke aflæse netudveksling pr. fase – kun husets forbrug pr. fase (måleren med
# direction=consumption) og spændingerne. CT-felterne er derfor husets forbrug pr. fase. Fasegrænsen for netladningen
# holdes af kanalen selv: netladestrømmens maks. er det, den værste fase har plads til (se wattlas_kanal_sonnen.yaml) –
# kernens eget fasebudget regner med en trefaset inverter og ville give et enfaset Sonnen-batteri op til 3 × for meget.
rest:
- resource: "__SONNEN_HOST__/api/v2/status"
  scan_interval: 5
  timeout: 8
  verify_ssl: false
  headers:
    Auth-Token: "__SONNEN_TOKEN__"
  sensor:
  - name: min_sonnen status
    unique_id: min_sonnen_status
    value_template: "{{ value_json.Consumption_W }}"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    json_attributes:
    - Production_W
    - Consumption_W
    - Pac_total_W
    - GridFeedIn_W
    - USOC
    - Uac
    - Ubat
    - OperatingMode
    - SystemStatus
- resource: "__SONNEN_HOST__/api/v2/powermeter"
  scan_interval: 15
  timeout: 8
  verify_ssl: false
  headers:
    Auth-Token: "__SONNEN_TOKEN__"
  sensor:
  - name: min_sonnen maaler w l1
    unique_id: min_sonnen_maaler_w_l1
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].w_l1 if m else 'unavailable' }}"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: min_sonnen maaler w l2
    unique_id: min_sonnen_maaler_w_l2
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].w_l2 if m else 'unavailable' }}"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: min_sonnen maaler w l3
    unique_id: min_sonnen_maaler_w_l3
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].w_l3 if m else 'unavailable' }}"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: min_sonnen maaler v l1
    unique_id: min_sonnen_maaler_v_l1
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].v_l1_n if m else 'unavailable' }}"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - name: min_sonnen maaler v l2
    unique_id: min_sonnen_maaler_v_l2
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].v_l2_n if m else 'unavailable' }}"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - name: min_sonnen maaler v l3
    unique_id: min_sonnen_maaler_v_l3
    value_template: "{% set m = value_json | selectattr('direction','eq','consumption') | list %}{{ m[0].v_l3_n if m else 'unavailable' }}"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
- resource: "__SONNEN_HOST__/api/v2/battery"
  scan_interval: 60
  timeout: 8
  verify_ssl: false
  headers:
    Auth-Token: "__SONNEN_TOKEN__"
  sensor:
  - name: min_sonnen batteri temperatur
    unique_id: min_sonnen_batteri_temperatur
    value_template: "{{ value_json.maximumcelltemperature if is_number(value_json.maximumcelltemperature) and value_json.maximumcelltemperature > -50 else 'unavailable' }}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
- resource: "__SONNEN_HOST__/api/v2/inverter"
  scan_interval: 15
  timeout: 8
  verify_ssl: false
  headers:
    Auth-Token: "__SONNEN_TOKEN__"
  sensor:
  - name: min_sonnen inverter temperatur
    unique_id: min_sonnen_inverter_temperatur
    value_template: "{{ value_json.tmax if is_number(value_json.tmax) and value_json.tmax > -50 else 'unavailable' }}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
- resource: "__SONNEN_HOST__/api/v2/configurations"
  scan_interval: 300
  timeout: 8
  verify_ssl: false
  headers:
    Auth-Token: "__SONNEN_TOKEN__"
  sensor:
  - name: min_sonnen konfiguration
    unique_id: min_sonnen_konfiguration
    value_template: "{{ value_json.IC_InverterMaxPower_w }}"
    json_attributes:
    - EM_OperatingMode
    - EM_USOC
    - EM_ToU_Schedule

# Sonnen kanalen har én målekilde – batteriet selv. Alderstjekket svarer til de andre kanaler.
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      sample: |-
        {% set t = as_timestamp(now()) %}
        {% set s = states.sensor.min_sonnen_status %}
        {% set status = state_attr('sensor.min_sonnen_status','SystemStatus') %}
        {% set m = dict(
          load_w_totalpower = states('sensor.min_sonnen_status'),
          grid_out_total_power = -(state_attr('sensor.min_sonnen_status','GridFeedIn_W') | float(0)),
          battery_output_w_power = state_attr('sensor.min_sonnen_status','Pac_total_W'),
          battery_soc = state_attr('sensor.min_sonnen_status','USOC'),
          battery_voltage = state_attr('sensor.min_sonnen_status','Ubat'),
          inverter_status = 'Normal' if status == 'OnGrid' else status,
          battery_temperature = states('sensor.min_sonnen_batteri_temperatur'),
          inverter_temperature = states('sensor.min_sonnen_inverter_temperatur'),
          external_ct_w_l1 = states('sensor.min_sonnen_maaler_w_l1'),
          external_ct_w_l2 = states('sensor.min_sonnen_maaler_w_l2'),
          external_ct_w_l3 = states('sensor.min_sonnen_maaler_w_l3'),
          grid_current_v_l1 = states('sensor.min_sonnen_maaler_v_l1'),
          grid_current_v_l2 = states('sensor.min_sonnen_maaler_v_l2'),
          grid_current_v_l3 = states('sensor.min_sonnen_maaler_v_l3')) %}
        {% set ns = namespace(ok=true) %}
        {% if not has_value('sensor.min_sonnen_status')
           or not is_number(state_attr('sensor.min_sonnen_status','GridFeedIn_W'))
           or not is_number(state_attr('sensor.min_sonnen_status','Pac_total_W'))
           or not is_number(state_attr('sensor.min_sonnen_status','USOC'))
           or not is_number(state_attr('sensor.min_sonnen_status','Ubat')) %}{% set ns.ok = false %}{% endif %}
        {% for k in ['external_ct_w_l1','external_ct_w_l2','external_ct_w_l3',
                     'grid_current_v_l1','grid_current_v_l2','grid_current_v_l3'] %}
          {% if not is_number(m[k]) %}{% set ns.ok = false %}{% endif %}
        {% endfor %}
        {% set rapp = s.last_reported.timestamp() if s is not none and s.last_reported is not none else 0 %}
        {% set ok = ns.ok and 0 <= t - rapp <= 90 %}
        {% set tider = namespace(d={}) %}
        {% for k in m %}{% set tider.d = dict(tider.d, **{k: rapp}) %}{% endfor %}
        {{ dict(source=('Sonnen' if ok else 'Ingen'), values=(m if ok else {}), times=(tider.d if ok else {}),
                maalekilde_ok=ok, sample_time=t) }}
  sensor:
  - name: EMHASS målekilde
    unique_id: emhass_maalekilde
    default_entity_id: sensor.emhass_maalekilde
    state: '{{ sample.source }}'
    attributes:
      values: '{{ sample[''values''] }}'
      raw_reported: '{{ sample[''times''] }}'
      sonnen_ok: '{{ sample[''maalekilde_ok''] }}'
      sample_time: '{{ sample[''sample_time''] }}'
- sensor:
  - name: EMHASS måling load_w_totalpower
    unique_id: emhass_m_load_w_totalpower
    default_entity_id: sensor.emhass_m_load_w_totalpower
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Sonnen''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''load_w_totalpower'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: EMHASS måling grid_out_total_power
    unique_id: emhass_m_grid_out_total_power
    default_entity_id: sensor.emhass_m_grid_out_total_power
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''grid_out_total_power'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Sonnen''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''grid_out_total_power'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''grid_out_total_power'',0)
