      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''Sonnen''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''grid_current_v_l3'',''unavailable''))
      }}'
    attributes:
