        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_today_energy_export') }}"
        state: "{{ states('sensor.min_inverter_today_energy_export') | float(0) }}"
      - name: Wattlas forbrug i dag
