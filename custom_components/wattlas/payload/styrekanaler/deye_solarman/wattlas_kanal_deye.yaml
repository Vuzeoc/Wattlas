      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('switch.min_inverter_battery_grid_charging') }}"
        state: "{{ is_state('switch.min_inverter_battery_grid_charging', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: {entity_id: switch.min_inverter_battery_grid_charging}
        turn_off:
          - action: switch.turn_off
            target: {entity_id: switch.min_inverter_battery_grid_charging}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: "{{ has_value('switch.min_inverter_export_surplus') }}"
