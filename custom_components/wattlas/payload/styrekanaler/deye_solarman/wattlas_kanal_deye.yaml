            target: {entity_id: switch.min_inverter_export_surplus}
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ has_value('number.min_inverter_battery_grid_charging_current') }}"
        state: "{{ states('number.min_inverter_battery_grid_charging_current') | float(0) }}"
        min: "{{ state_attr('number.min_inverter_battery_grid_charging_current', 'min') | float(0) }}"
        max: "{{ state_attr('number.min_inverter_battery_grid_charging_current', 'max') | float(100) }}"
        step: "{{ state_attr('number.min_inverter_battery_grid_charging_current', 'step') | float(1) }}"
        unit_of_measurement: "A"
        set_value:
          - action: number.set_value
            target: {entity_id: number.min_inverter_battery_grid_charging_current}
            data: {value: "{{ value }}"}
