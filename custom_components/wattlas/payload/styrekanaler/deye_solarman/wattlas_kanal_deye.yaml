        availability: "{{ has_value('number.min_inverter_battery_max_charging_current') }}"
        state: "{{ states('number.min_inverter_battery_max_charging_current') | float(0) }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
