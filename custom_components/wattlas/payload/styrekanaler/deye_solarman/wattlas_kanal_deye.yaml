  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        availability: "{{ has_value('select.min_inverter_time_of_use') }}"
        state: "{{ not is_state('select.min_inverter_time_of_use', 'Disabled') }}"
  # Målinger til økonomi, rapport og app (kWh-tællere). Produktion = Deye + evt. inverter på GEN-porten (mikroinverter).
  - sensor:
      - name: Wattlas produktion i dag
        unique_id: wattlas_i_dag_produktion
        default_entity_id: sensor.wattlas_i_dag_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_today_production') }}"
        state: "{{ (states('sensor.min_inverter_today_production') | float(0) + states('sensor.min_inverter_microinverter_energy_today') | float(0)) | round(2) }}"
      - name: Wattlas produktion i alt
        unique_id: wattlas_total_produktion
        default_entity_id: sensor.wattlas_total_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_total_production') }}"
        state: "{{ (states('sensor.min_inverter_total_production') | float(0) + states('sensor.min_inverter_microinverter_energy') | float(0)) | round(2) }}"
      - name: Wattlas købt i dag
        unique_id: wattlas_i_dag_koebt
        default_entity_id: sensor.wattlas_i_dag_koebt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.min_inverter_today_energy_import') }}"
        state: "{{ states('sensor.min_inverter_today_energy_import') | float(0) }}"
      - name: Wattlas solgt i dag
