        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_inverter_pv_power')) }}"
        state: "{{ ([0, states('sensor.min_inverter_pv_power') | float(0)] | max + [0, states('sensor.min_inverter_microinverter_power') | float(0)] | max) | round(0) }}"
