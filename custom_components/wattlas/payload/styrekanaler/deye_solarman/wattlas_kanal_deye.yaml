# Wattlas styrekanal – Deye via Solarman (ha-solarman). Enheden skal hedde "min_inverter" (se docs/STYREKANALER.md).
# Kernen (emhass_*.yaml, wattlas_styring.yaml) taler KUN med disse Wattlas-entiteter. Vil man bruge en anden
# inverter (fx SunMate eller Sunsynk), udskiftes denne fil med en anden styrekanal med samme entiteter.
# Netladning pr. tidsprogram: Deye har en valgmenu pr. program (Disabled/Grid/Generator/Both) – til = Grid, fra = Disabled.
# Solarman viser en skrivning med det samme, men genlæser først efter ca. 5 min.
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        availability: "{{ has_value('select.min_inverter_program_1_charging') }}"
        state: "{{ states('select.min_inverter_program_1_charging') in ['Grid', 'Both'] }}"
        turn_on:
          - action: select.select_option
            target: {entity_id: select.min_inverter_program_1_charging}
            data: {option: Grid}
        turn_off:
          - action: select.select_option
            target: {entity_id: select.min_inverter_program_1_charging}
            data: {option: Disabled}
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
