    device_class: power
    state_class: measurement
  - name: EMHASS måling grid_current_v_l2
    unique_id: emhass_m_grid_current_v_l2
    default_entity_id: sensor.emhass_m_grid_current_v_l2
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''grid_current_v_l2'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SPF''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''grid_current_v_l2'',''unavailable''))
      }}'
