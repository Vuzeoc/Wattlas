      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''grid_current_v_l3'',0)
        }}'
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  binary_sensor:
  - name: EMHASS styrekanal (SPF)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['sensor.min_spf_output','sensor.min_spf_lader','sensor.min_spf_netstroem'] %}
       {% if not has_value(e) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.wattlas_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','spf_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=90 }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: >-
        SPF-styrekanalen er ikke klar – der kommer ingen målinger fra Solar Assistant over MQTT, regnestykket mellem sol, batteri, net og
        forbrug passer ikke, eller Solar Assistant tog ikke imod en indstilling (er "Allow setting changes" slået til under MQTT Broker?
        Se sensor.min_spf_svar). Netopladning er forsøgt stoppet; faktisk inverterdrift skal kontrolleres.
