      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SPF''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''external_ct_w_l2'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''external_ct_w_l2'',0)
        }}'
