  wattlas_spf_oensket:
    name: Wattlas SPF ønskede indstillinger
    max: 120
  wattlas_spf_egen_output:
    name: Wattlas SPF – din egen output source priority (husket)
    max: 60
  wattlas_spf_egen_lader:
    name: Wattlas SPF – din egen charger source priority (husket)
    max: 60
