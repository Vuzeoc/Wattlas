  wattlas_spf_sat_stroem:
    name: Wattlas SPF sidst sendte netladestrøm
    min: 0
    max: 200
    step: 1
    unit_of_measurement: A
  wattlas_spf_p1_soc:
    name: Wattlas Spf program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_spf_p1_power:
    name: Wattlas Spf program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_spf_p2_soc:
    name: Wattlas Spf program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_spf_p2_power:
    name: Wattlas Spf program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_spf_p3_soc:
    name: Wattlas Spf program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_spf_p3_power:
    name: Wattlas Spf program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_spf_p4_soc:
    name: Wattlas Spf program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_spf_p4_power:
    name: Wattlas Spf program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_spf_p5_soc:
    name: Wattlas Spf program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_spf_p5_power:
    name: Wattlas Spf program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_spf_p6_soc:
    name: Wattlas Spf program 6 SOC (husket)
    min: 0
