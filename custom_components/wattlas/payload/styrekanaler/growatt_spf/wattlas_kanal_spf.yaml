# Wattlas styrekanal – Growatt SPF (off-grid, enfaset, 48 V, fx SPF 5000 ES) via Solar Assistants MQTT.
# EKSPERIMENTEL: skrevet ud fra Solar Assistants MQTT-vejledning og offentligt beskrevne emner – ikke kørt på et rigtigt anlæg, og
# valgteksterne herunder er ikke bekræftet på en SPF. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Krav: MQTT-integrationen i Home Assistant får Solar Assistants emner (solar_assistant/…), og i Solar Assistant er
# Configuration → MQTT Broker → "Allow setting changes" slået til. Kun én inverter (inverter_1).
#
# Sådan styres (skrives til solar_assistant/inverter_1/<navn>/set, og kun når inverterens egen værdi er en anden):
#   netladning = output "Utility first" + lader "Solar and utility simultaneously" + max_grid_charge_current (hele 10 A)
#   gem        = output "Utility first" + lader "Solar only": huset fra nettet, batteriet lades kun af sol. Kun uden soloverskud
#   fri        = output "Solar/Battery/Utility" + lader "Solar only": huset fra sol og batteri
#   slip       = dine egne tre værdier fra før Wattlas overtog, sættes tilbage
#
# SPF gemmer indstillingerne i inverterens hukommelse, som slides: strømmen hæves højst hvert 3. minut, der skiftes højst hvert 10. minut mellem gem og fri, og efter 40 skrivninger på et døgn startes ingen ny netladning før midnat. Ned og stop er altid tilladt.
#
# BEMÆRK: SPF har ingen nedtælling. Går Home Assistant eller Solar Assistant ned under netladning, lader den videre med den sidste
# strøm, til batteriet er fuldt. Og inverteren ser kun sin egen net-indgang: fasegrænsen beskytter den, ikke husets andre forbrug.
# Off-grid: intet salg til nettet. Solsalg-kontakten huskes kun.
mqtt:
  - sensor:
      - {name: min_spf soc, unique_id: min_spf_soc, default_entity_id: sensor.min_spf_soc, state_topic: solar_assistant/total/battery_state_of_charge/state, unit_of_measurement: "%", device_class: battery, state_class: measurement, force_update: true}
      - {name: min_spf batteri, unique_id: min_spf_batteri, default_entity_id: sensor.min_spf_batteri, state_topic: solar_assistant/total/battery_power/state, unit_of_measurement: W, device_class: power, state_class: measurement, force_update: true}
      - {name: min_spf sol, unique_id: min_spf_sol, default_entity_id: sensor.min_spf_sol, state_topic: solar_assistant/inverter_1/pv_power/state, unit_of_measurement: W, device_class: power, state_class: measurement, force_update: true}
      - {name: min_spf forbrug, unique_id: min_spf_forbrug, default_entity_id: sensor.min_spf_forbrug, state_topic: solar_assistant/inverter_1/load_power/state, unit_of_measurement: W, device_class: power, state_class: measurement, force_update: true}
      - {name: min_spf net, unique_id: min_spf_net, default_entity_id: sensor.min_spf_net, state_topic: solar_assistant/inverter_1/grid_power/state, unit_of_measurement: W, device_class: power, state_class: measurement, force_update: true}
      - {name: min_spf netspaending, unique_id: min_spf_netspaending, default_entity_id: sensor.min_spf_netspaending, state_topic: solar_assistant/inverter_1/grid_voltage/state, unit_of_measurement: V, device_class: voltage, state_class: measurement, force_update: true}
      - {name: min_spf batterispaending, unique_id: min_spf_batterispaending, default_entity_id: sensor.min_spf_batterispaending, state_topic: solar_assistant/inverter_1/battery_voltage/state, unit_of_measurement: V, device_class: voltage, state_class: measurement, force_update: true}
      - {name: min_spf temperatur, unique_id: min_spf_temperatur, default_entity_id: sensor.min_spf_temperatur, state_topic: solar_assistant/inverter_1/temperature/state, device_class: temperature, unit_of_measurement: "°C", state_class: measurement, force_update: true}
      - {name: min_spf tilstand, unique_id: min_spf_tilstand, default_entity_id: sensor.min_spf_tilstand, state_topic: solar_assistant/inverter_1/device_mode/state}
      - {name: min_spf output, unique_id: min_spf_output, default_entity_id: sensor.min_spf_output, state_topic: solar_assistant/inverter_1/output_source_priority/state}
      - {name: min_spf lader, unique_id: min_spf_lader, default_entity_id: sensor.min_spf_lader, state_topic: solar_assistant/inverter_1/charger_source_priority/state}
      - {name: min_spf netstroem, unique_id: min_spf_netstroem, default_entity_id: sensor.min_spf_netstroem, state_topic: solar_assistant/inverter_1/max_grid_charge_current/state, unit_of_measurement: A, device_class: current, state_class: measurement}
      - {name: min_spf svar, unique_id: min_spf_svar, default_entity_id: sensor.min_spf_svar, state_topic: solar_assistant/set/response_message/state, value_template: "{{ value[:250] }}"}
input_boolean:
  wattlas_spf_netladning:
    name: Wattlas SPF netladning (husket)
  wattlas_spf_styret:
    name: Wattlas SPF har overtaget indstillingerne
  wattlas_spf_solsalg:
    name: Wattlas SPF solsalg (husket – off-grid sælger ikke)
  wattlas_spf_p1:
    name: Wattlas Spf netladning program 1 (husket)
  wattlas_spf_p2:
    name: Wattlas Spf netladning program 2 (husket)
  wattlas_spf_p3:
    name: Wattlas Spf netladning program 3 (husket)
  wattlas_spf_p4:
    name: Wattlas Spf netladning program 4 (husket)
  wattlas_spf_p5:
    name: Wattlas Spf netladning program 5 (husket)
  wattlas_spf_p6:
    name: Wattlas Spf netladning program 6 (husket)
input_text:
  wattlas_spf_tilstand_nu:
    name: Wattlas SPF tilstand (lad, gem, fri eller slip)
