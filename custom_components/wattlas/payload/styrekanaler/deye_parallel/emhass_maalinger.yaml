  binary_sensor:
  - name: EMHASS styrekanal (Deye)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set par=namespace(ok=true) %}
      {% for e in ['switch.min_inverter_battery_grid_charging', 'select.min_inverter_time_of_use', 'number.min_inverter_battery_grid_charging_current', 'select.min_inverter_program_1_charging', 'select.min_inverter_program_2_charging', 'select.min_inverter_program_3_charging', 'select.min_inverter_program_4_charging', 'select.min_inverter_program_5_charging', 'select.min_inverter_program_6_charging', 'number.min_inverter_program_1_soc', 'number.min_inverter_program_2_soc', 'number.min_inverter_program_3_soc', 'number.min_inverter_program_4_soc', 'number.min_inverter_program_5_soc', 'number.min_inverter_program_6_soc', 'number.min_inverter_program_1_power', 'number.min_inverter_program_2_power', 'number.min_inverter_program_3_power', 'number.min_inverter_program_4_power', 'number.min_inverter_program_5_power', 'number.min_inverter_program_6_power'] %}
       {% set a=states[e] %}{% set b=states[e | replace('.min_inverter_', '.min_slave_')] %}
       {% if a is not none and b is not none and a.state != b.state and (now() - a.last_changed).total_seconds() > 180 %}{% set par.ok=false %}{% endif %}
      {% endfor %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['number.min_inverter_battery_max_charging_current','number.min_inverter_battery_max_discharging_current','number.min_inverter_battery_grid_charging_current'] %}
       {% if not is_number(states(e)) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.min_inverter_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and 0<=t-(state_attr('sensor.emhass_maalekilde','solarman_heartbeat')|float(0))<=90
       and has_value('sensor.min_inverter_device_state')
       and has_value('switch.min_inverter_battery_grid_charging') and has_value('switch.min_slave_battery_grid_charging') and par.ok
       and (has_value('select.min_inverter_time_of_use') and not is_state('select.min_inverter_time_of_use','Disabled')) }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: Deye-styrekanalen eller driftsindstillingerne er ikke klar. Deye kan levere målinger, men kan
        ikke overtage skriveadgangen. Netopladning er forsøgt stoppet; faktisk inverterdrift skal kontrolleres.
