        turn_off: [{action: switch.turn_off, target: {entity_id: switch.min_sunmate_charge_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('switch.min_sunmate_grid_charge') }}"
        state: "{{ is_state('switch.min_sunmate_grid_charge', 'on') }}"
        turn_on: [{action: switch.turn_on, target: {entity_id: switch.min_sunmate_grid_charge}}]
        turn_off: [{action: switch.turn_off, target: {entity_id: switch.min_sunmate_grid_charge}}]
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: "{{ has_value('switch.min_sunmate_solar_sell') }}"
        state: "{{ is_state('switch.min_sunmate_solar_sell', 'on') }}"
        turn_on: [{action: switch.turn_on, target: {entity_id: switch.min_sunmate_solar_sell}}]
        turn_off: [{action: switch.turn_off, target: {entity_id: switch.min_sunmate_solar_sell}}]
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ is_number(states('number.min_sunmate_battery_max_grid_charge')) }}"
        state: "{{ states('number.min_sunmate_battery_max_grid_charge') | float(0) }}"
        min: "{{ state_attr('number.min_sunmate_battery_max_grid_charge', 'min') | float(0) }}"
        max: "{{ state_attr('number.min_sunmate_battery_max_grid_charge', 'max') | float(0) }}"
        step: "{{ state_attr('number.min_sunmate_battery_max_grid_charge', 'step') | float(1) }}"
        unit_of_measurement: A
        set_value: [{action: number.set_value, target: {entity_id: number.min_sunmate_battery_max_grid_charge}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        availability: "{{ is_number(states('number.min_sunmate_timepoint_1_capacity')) }}"
        state: "{{ states('number.min_sunmate_timepoint_1_capacity') | float(0) }}"
        min: "{{ state_attr('number.min_sunmate_timepoint_1_capacity', 'min') | float(0) }}"
        max: "{{ state_attr('number.min_sunmate_timepoint_1_capacity', 'max') | float(0) }}"
        step: "{{ state_attr('number.min_sunmate_timepoint_1_capacity', 'step') | float(1) }}"
        unit_of_measurement: "%"
        set_value: [{action: number.set_value, target: {entity_id: number.min_sunmate_timepoint_1_capacity}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
