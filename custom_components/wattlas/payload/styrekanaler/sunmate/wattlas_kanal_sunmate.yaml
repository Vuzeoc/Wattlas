        availability: "{{ is_number(states('number.min_sunmate_timepoint_3_capacity')) }}"
        state: "{{ states('number.min_sunmate_timepoint_3_capacity') | float(0) }}"
        min: "{{ state_attr('number.min_sunmate_timepoint_3_capacity', 'min') | float(0) }}"
        max: "{{ state_attr('number.min_sunmate_timepoint_3_capacity', 'max') | float(0) }}"
        step: "{{ state_attr('number.min_sunmate_timepoint_3_capacity', 'step') | float(1) }}"
