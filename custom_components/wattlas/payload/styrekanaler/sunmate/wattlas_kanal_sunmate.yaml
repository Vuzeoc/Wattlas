        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_total_energy_bought')) }}"
        state: "{{ states('sensor.min_sunmate_total_energy_bought') | float(0) }}"
      - name: Wattlas solgt i alt
        unique_id: wattlas_total_solgt
        default_entity_id: sensor.wattlas_total_solgt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_total_energy_sold')) }}"
        state: "{{ states('sensor.min_sunmate_total_energy_sold') | float(0) }}"
      - name: Wattlas batteri ladet i dag
        unique_id: wattlas_i_dag_ladet
        default_entity_id: sensor.wattlas_i_dag_ladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_daily_battery_charge')) }}"
        state: "{{ states('sensor.min_sunmate_daily_battery_charge') | float(0) }}"
      - name: Wattlas batteri afladet i dag
        unique_id: wattlas_i_dag_afladet
        default_entity_id: sensor.wattlas_i_dag_afladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_daily_battery_discharge')) }}"
        state: "{{ states('sensor.min_sunmate_daily_battery_discharge') | float(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        availability: "{{ has_value('switch.min_sunmate_timeofuse') }}"
        state: "{{ is_state('switch.min_sunmate_timeofuse', 'on') and states('number.min_sunmate_inverter_control_mode') | float(-1) == 2 }}"
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_sunmate_inverter_status %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_sunmate_pv_totalpower')) }}"

# SunMate har ingen dagstællere for køb/salg/forbrug – de laves her med HA's egne værktøjer.
sensor:
  - platform: integration
    source: sensor.emhass_m_load_w_totalpower
    name: wattlas_total_forbrug  # navnet giver entity_id sensor.wattlas_total_forbrug
    unique_id: wattlas_total_forbrug
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval:
      minutes: 1

utility_meter:
  wattlas_i_dag_koebt:
    name: Wattlas købt i dag
    unique_id: wattlas_i_dag_koebt
    source: sensor.wattlas_total_koebt
    cycle: daily
  wattlas_i_dag_solgt:
    name: Wattlas solgt i dag
    unique_id: wattlas_i_dag_solgt
    source: sensor.wattlas_total_solgt
    cycle: daily
  wattlas_i_dag_forbrug:
    name: Wattlas forbrug i dag
    unique_id: wattlas_i_dag_forbrug
    source: sensor.wattlas_total_forbrug
    cycle: daily
