        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        availability: "{{ has_value('switch.min_sunmate_charge_p4') }}"
        state: "{{ is_state('switch.min_sunmate_charge_p4', 'on') }}"
        turn_on: [{action: switch.turn_on, target: {entity_id: switch.min_sunmate_charge_p4}}]
        turn_off: [{action: switch.turn_off, target: {entity_id: switch.min_sunmate_charge_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
