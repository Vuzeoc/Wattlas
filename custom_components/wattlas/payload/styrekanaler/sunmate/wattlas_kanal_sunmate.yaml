# Wattlas styrekanal – SunMate (SunMate.IO pulse styrer inverteren, fx Deye/Sunsynk via SunMate-boksen).
# ALPHA: bygget ud fra en SunMate-opsætning, der kørte med Wattlas' forgænger frem til nov. 2026 – ikke testet med
# denne version. Kernen taler KUN med Wattlas-entiteterne herunder.
# SunMate-enheden skal hedde "min_sunmate" i HA (entiteter som switch.min_sunmate_grid_charge), eller søg/erstat
# "min_sunmate" med dit eget prefix i denne fil og i emhass_maalinger.yaml (se docs/STYREKANALER.md).
# Krav i SunMate-appen: "Inverter control mode" = 2 (Home Assistant styrer) og Time of use slået til.
template:
