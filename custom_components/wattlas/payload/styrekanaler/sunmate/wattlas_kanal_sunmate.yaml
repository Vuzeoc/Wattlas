      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        availability: "{{ has_value('switch.min_sunmate_charge_p1') }}"
        state: "{{ is_state('switch.min_sunmate_charge_p1', 'on') }}"
        turn_on: [{action: switch.turn_on, target: {entity_id: switch.min_sunmate_charge_p1}}]
        turn_off: [{action: switch.turn_off, target: {entity_id: switch.min_sunmate_charge_p1}}]
