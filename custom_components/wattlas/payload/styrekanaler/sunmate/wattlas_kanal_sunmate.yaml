        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ has_value('number.min_sunmate_battery_max_charge') }}"
        state: "{{ states('number.min_sunmate_battery_max_charge') | float(0) }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ has_value('number.min_sunmate_battery_max_discharge') }}"
        state: "{{ states('number.min_sunmate_battery_max_discharge') | float(0) }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_sunmate_pv_totalpower')) }}"
        state: >-
          {{ ([0, states('sensor.min_sunmate_pv_totalpower') | float(0)] | max
              + [0, states('sensor.min_sunmate_generator_w_totalpower') | float(0)] | max) | round(0) }}
      - name: Wattlas produktion i dag
        unique_id: wattlas_i_dag_produktion
        default_entity_id: sensor.wattlas_i_dag_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_daily_production')) }}"
        state: "{{ states('sensor.min_sunmate_daily_production') | float(0) }}"
      - name: Wattlas produktion i alt
        unique_id: wattlas_total_produktion
        default_entity_id: sensor.wattlas_total_produktion
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_sunmate_pv_total_production')) }}"
        state: "{{ states('sensor.min_sunmate_pv_total_production') | float(0) }}"
      - name: Wattlas købt i alt
