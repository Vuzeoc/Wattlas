        min: "{{ state_attr('number.min_sunmate_timepoint_1_power', 'min') | float(0) }}"
        max: "{{ state_attr('number.min_sunmate_timepoint_1_power', 'max') | float(0) }}"
        step: "{{ state_attr('number.min_sunmate_timepoint_1_power', 'step') | float(1) }}"
