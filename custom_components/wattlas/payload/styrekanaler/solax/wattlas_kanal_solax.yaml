# Wattlas styrekanal – SolaX X3-Hybrid G4 via solax_modbus (wills106/homeassistant-solax-modbus).
# EKSPERIMENTEL: skrevet ud fra solax_modbus' egen dokumentation og kildekode (Apache-2.0) og prøvet i en test-Home Assistant
# med den rigtige solax_modbus mod en falsk SolaX – ikke kørt på et rigtigt anlæg endnu. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Enheden hedder min_solax_* (navnet på solax_modbus-forbindelsen vælges i opsætningen). Kun trefasede SolaX-hybrider af
# generation 4 (X3-Hybrid G4) med SolaX-elmåler og lokal forbindelse (Modbus TCP/RTU). I solax_modbus skal
# "Grid Voltage L1–L3" slås til (de er slået fra som standard).
#
# Styring sker gennem SolaX' fjernstyring "Remotecontrol (mode 1)". Registrene gemmes ikke i inverterens hukommelse, så hyppige
# skrivninger slider ikke, og hver kommando gælder kun i et kort tidsrum (remotecontrol_duration, standard 20 s). solax_modbus
# gentager den selv (autorepeat); går Home Assistant ned, holder gentagelsen op, og inverteren går tilbage til egen drift.
#   netladning = "Enabled Power Control" med en positiv effekt: inverteren trækker netop den effekt fra nettet ind i batteriet
#                (solen lægges oveni). Fornyes hvert minut med 10 minutters gentagelse.
#   gem        = "Enabled No Discharge" – batteriet aflader næsten ikke (solax_modbus lader med vilje ca. 150 W slippe ud). Kun uden soloverskud: ellers ville huset købe fra nettet,
#                mens solen lader batteriet; med overskud kører inverteren egen drift (overskuddet lades, intet aflades).
#   fri        = fjernstyring fra ("Disabled") – inverteren kører sin egen drift (fx Self Use).
# Højvoltbatteri: kernen regner i A ved et lavvoltbatteri. Kanalen bruger en fast beregningsspænding på 50 V
# (A × 50 = W) – samme tal som i opsætningen.
#
# SolaX har ingen tidsprogrammer, Wattlas kan bruge. Kanalen husker dem selv og bruger det aktive programs værdier i
# samme perioder som kernen (1: 01–05, 2: 05–09, 3: 09–13, 4: 13–17, 5: 17–21, 6: 21–01):
#   SOC    = bundgrænse (ved eller under den gemmes batteriet) og mål ved netladning
#   effekt = 0 W gemmer batteriet; over 0 W må det aflade frit (fjernstyringen kan ikke begrænse afladningen til et bestemt antal W)
# Solsalg fra = eksportgrænsen (Export Control User Limit) sættes til 0 W; din egen grænse huskes og sættes tilbage.
input_boolean:
  wattlas_solax_netladning:
    name: Wattlas SolaX netladning (husket)
  wattlas_solax_fjern_styret:
    name: Wattlas SolaX har slået fjernstyring til
  wattlas_solax_salg_stoppet:
    name: Wattlas SolaX har stoppet solsalget
  wattlas_solax_p1:
    name: Wattlas Solax netladning program 1 (husket)
  wattlas_solax_p2:
    name: Wattlas Solax netladning program 2 (husket)
  wattlas_solax_p3:
    name: Wattlas Solax netladning program 3 (husket)
  wattlas_solax_p4:
    name: Wattlas Solax netladning program 4 (husket)
  wattlas_solax_p5:
    name: Wattlas Solax netladning program 5 (husket)
  wattlas_solax_p6:
    name: Wattlas Solax netladning program 6 (husket)
input_number:
  wattlas_solax_netladestroem:
    name: Wattlas SolaX netladestrøm (husket)
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: A
  wattlas_solax_egen_eksportgraense:
    name: Wattlas SolaX – din egen eksportgrænse (husket)
    min: 0
    max: 60000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p1_soc:
    name: Wattlas Solax program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p1_power:
    name: Wattlas Solax program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p2_soc:
    name: Wattlas Solax program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p2_power:
    name: Wattlas Solax program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p3_soc:
    name: Wattlas Solax program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p3_power:
    name: Wattlas Solax program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p4_soc:
    name: Wattlas Solax program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p4_power:
    name: Wattlas Solax program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p5_soc:
    name: Wattlas Solax program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p5_power:
    name: Wattlas Solax program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_solax_p6_soc:
    name: Wattlas Solax program 6 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_solax_p6_power:
    name: Wattlas Solax program 6 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        state: "{{ is_state('input_boolean.wattlas_solax_p1', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p1}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p1}}]
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
        state: "{{ is_state('input_boolean.wattlas_solax_p2', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p2}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p2}}]
      - name: EMHASS netladning program 3
        unique_id: emhass_netladning_p3
        default_entity_id: switch.emhass_netladning_p3
        state: "{{ is_state('input_boolean.wattlas_solax_p3', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p3}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p3}}]
      - name: EMHASS netladning program 4
        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        state: "{{ is_state('input_boolean.wattlas_solax_p4', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p4}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
        state: "{{ is_state('input_boolean.wattlas_solax_p5', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p5}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p5}}]
      - name: EMHASS netladning program 6
        unique_id: emhass_netladning_p6
        default_entity_id: switch.emhass_netladning_p6
        state: "{{ is_state('input_boolean.wattlas_solax_p6', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_p6}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_solax_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('select.min_solax_remotecontrol_power_control_mode_1') }}"
        state: "{{ is_state('input_boolean.wattlas_solax_netladning', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_solax_netladning}}]
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.wattlas_solax_netladning}
          # stoppes med det samme her (automationen nedenfor gør det også), så "fra" er fra, når kernen går videre
          - if: "{{ is_state('input_boolean.wattlas_solax_fjern_styret', 'on') and is_state('select.min_solax_remotecontrol_power_control_mode_1', 'Enabled Power Control') }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target: {entity_id: select.min_solax_remotecontrol_power_control_mode_1}
                data: {option: Disabled}
              - action: button.press
                continue_on_error: true
                target: {entity_id: button.min_solax_remotecontrol_trigger_mode_1_7}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        availability: "{{ is_number(states('number.min_solax_export_control_user_limit')) }}"
        # "til", indtil Wattlas selv har stoppet salget – en ny installation skriver derfor intet til inverteren
        state: "{{ not is_state('input_boolean.wattlas_solax_salg_stoppet', 'on') }}"
        turn_on:
          - if: "{{ is_state('input_boolean.wattlas_solax_salg_stoppet', 'on') }}"
            then:
              - action: number.set_value
                target: {entity_id: number.min_solax_export_control_user_limit}
                data: {value: "{{ states('input_number.wattlas_solax_egen_eksportgraense') | float(0) }}"}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_solax_salg_stoppet}
        turn_off:
          # eksportgrænsen gemmes i inverterens hukommelse – skrives kun, når den skifter
          - if: "{{ not is_state('input_boolean.wattlas_solax_salg_stoppet', 'on') }}"
            then:
              - action: input_number.set_value
                target: {entity_id: input_number.wattlas_solax_egen_eksportgraense}
                data: {value: "{{ states('number.min_solax_export_control_user_limit') | float(0) }}"}
              - action: number.set_value
                target: {entity_id: number.min_solax_export_control_user_limit}
                data: {value: 0}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_solax_salg_stoppet}
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ states('input_number.wattlas_solax_netladestroem') | float(0) }}"
        min: 0
        max: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
        step: 1
        unit_of_measurement: A
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_netladestroem}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        state: "{{ states('input_number.wattlas_solax_p1_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p1_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
        unique_id: wattlas_program_1_power
        default_entity_id: number.wattlas_program_1_power
        state: "{{ states('input_number.wattlas_solax_p1_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p1_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 SOC
        unique_id: wattlas_program_2_soc
        default_entity_id: number.wattlas_program_2_soc
        state: "{{ states('input_number.wattlas_solax_p2_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p2_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 effekt
        unique_id: wattlas_program_2_power
        default_entity_id: number.wattlas_program_2_power
        state: "{{ states('input_number.wattlas_solax_p2_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p2_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 SOC
        unique_id: wattlas_program_3_soc
        default_entity_id: number.wattlas_program_3_soc
        state: "{{ states('input_number.wattlas_solax_p3_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p3_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 effekt
        unique_id: wattlas_program_3_power
        default_entity_id: number.wattlas_program_3_power
        state: "{{ states('input_number.wattlas_solax_p3_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p3_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 SOC
        unique_id: wattlas_program_4_soc
        default_entity_id: number.wattlas_program_4_soc
        state: "{{ states('input_number.wattlas_solax_p4_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p4_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 effekt
        unique_id: wattlas_program_4_power
        default_entity_id: number.wattlas_program_4_power
        state: "{{ states('input_number.wattlas_solax_p4_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p4_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 SOC
        unique_id: wattlas_program_5_soc
        default_entity_id: number.wattlas_program_5_soc
        state: "{{ states('input_number.wattlas_solax_p5_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p5_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 effekt
        unique_id: wattlas_program_5_power
        default_entity_id: number.wattlas_program_5_power
        state: "{{ states('input_number.wattlas_solax_p5_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p5_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 SOC
        unique_id: wattlas_program_6_soc
        default_entity_id: number.wattlas_program_6_soc
        state: "{{ states('input_number.wattlas_solax_p6_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p6_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 effekt
        unique_id: wattlas_program_6_power
        default_entity_id: number.wattlas_program_6_power
        state: "{{ states('input_number.wattlas_solax_p6_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_solax_p6_power}, data: {value: "{{ value }}"}}]
  - sensor:
      # SolaX-fjernstyringen bruger effekt (W), ikke batteristrøm – kanalen bruger din indstilling "maks. ladeeffekt" (W ÷ 50)
      - name: Wattlas maks. ladestrøm
        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_afladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_afladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_solax_pv_power_total')) }}"
        state: "{{ [0, states('sensor.min_solax_pv_power_total') | float(0)] | max | round(0) }}"
      # effekter til dagstællerne: elmålerens tal er positivt ved salg
      - name: Wattlas SolaX netkøb
        unique_id: wattlas_solax_netkoeb
        default_entity_id: sensor.wattlas_solax_netkoeb
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_solax_grid_feed_in_power')) }}"
        state: "{{ [0, -(states('sensor.min_solax_grid_feed_in_power') | float(0))] | max | round(0) }}"
      - name: Wattlas SolaX solgt
        unique_id: wattlas_solax_solgt
        default_entity_id: sensor.wattlas_solax_solgt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_solax_grid_feed_in_power')) }}"
        state: "{{ [0, states('sensor.min_solax_grid_feed_in_power') | float(0)] | max | round(0) }}"
      - name: Wattlas batteri ladet i dag
        unique_id: wattlas_i_dag_ladet
        default_entity_id: sensor.wattlas_i_dag_ladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_solax_battery_input_energy_today')) }}"
        state: "{{ states('sensor.min_solax_battery_input_energy_today') | float(0) }}"
      - name: Wattlas batteri afladet i dag
        unique_id: wattlas_i_dag_afladet
        default_entity_id: sensor.wattlas_i_dag_afladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_solax_battery_output_energy_today')) }}"
        state: "{{ states('sensor.min_solax_battery_output_energy_today') | float(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        # SolaX har ingen tidsprogrammer; kanalens egne virker, når fjernstyringen findes i solax_modbus
        state: "{{ has_value('select.min_solax_remotecontrol_power_control_mode_1') and states.button.min_solax_remotecontrol_trigger_mode_1_7 is not none }}"
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_solax_run_mode %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_solax_pv_power_total')) }}"

# Produktion, forbrug og købt/solgt laves her med HA's egne værktøjer ud fra effekterne (samme tal for alle SolaX-udgaver).
sensor:
  - platform: integration
    source: sensor.emhass_solproduktion_samlet
    name: wattlas_total_produktion  # navnet bliver entity_id
    unique_id: wattlas_total_produktion
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_solax_house_load
    name: wattlas_total_forbrug  # navnet bliver entity_id
    unique_id: wattlas_total_forbrug
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_solax_netkoeb
    name: wattlas_total_koebt  # navnet bliver entity_id
    unique_id: wattlas_total_koebt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.wattlas_solax_solgt
    name: wattlas_total_solgt  # navnet bliver entity_id
    unique_id: wattlas_total_solgt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
utility_meter:
  wattlas_i_dag_produktion:
    unique_id: wattlas_i_dag_produktion
    source: sensor.wattlas_total_produktion
    cycle: daily
  wattlas_i_dag_forbrug:
    unique_id: wattlas_i_dag_forbrug
    source: sensor.wattlas_total_forbrug
    cycle: daily
  wattlas_i_dag_koebt:
    unique_id: wattlas_i_dag_koebt
    source: sensor.wattlas_total_koebt
    cycle: daily
  wattlas_i_dag_solgt:
    unique_id: wattlas_i_dag_solgt
    source: sensor.wattlas_total_solgt
    cycle: daily

automation:
  - id: wattlas_solax_styring
    alias: Wattlas SolaX – styring
    description: >-
      Det eneste sted, Wattlas styrer SolaX. Lader fra nettet (fornyes hvert minut, kun op til det aktive programs SOC),
      gemmer batteriet (ingen afladning) eller giver inverteren sin egen drift tilbage. Uden for styringen slås kun Wattlas'
      egen fjernstyring fra, og et stoppet solsalg gives tilbage.
    # en ny ordre afbryder den gamle: en kø ville kunne sende en forældet ladeordre, efter at ladningen er stoppet
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_boolean.wattlas_solax_netladning, input_number.wattlas_solax_netladestroem,
                    input_boolean.emhass_styring_aktiv, input_boolean.emhass_har_overtaget]
      - trigger: state
        entity_id: [input_boolean.wattlas_solax_p1, input_boolean.wattlas_solax_p2, input_boolean.wattlas_solax_p3,
                    input_boolean.wattlas_solax_p4, input_boolean.wattlas_solax_p5, input_boolean.wattlas_solax_p6]
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_solax_battery_capacity') | float(-1) }}"
      maal: "{{ states('input_number.wattlas_solax_p' ~ periode ~ '_soc') | float(0) }}"
      effekt: "{{ states('input_number.wattlas_solax_p' ~ periode ~ '_power') | float(0) }}"
      # solax_modbus tager højst 30000 W
      loft: "{{ [states('input_number.wattlas_maks_ladeeffekt_w') | float(0), 30000] | min }}"
      # effekten fra nettet i hele 100 W, aldrig over loftet
      watt: "{{ ([states('input_number.wattlas_solax_netladestroem') | float(0) * 50, loft] | min / 100) | round(0, 'floor') * 100 }}"
      styrer: "{{ is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.emhass_har_overtaget', 'on') }}"
      overskud: "{{ states('sensor.min_solax_pv_power_total') | float(0) - states('sensor.min_solax_house_load') | float(0) }}"
      tilstand: >-
        {% if styrer and is_state('input_boolean.wattlas_solax_netladning', 'on')
              and is_state('input_boolean.wattlas_solax_p' ~ periode, 'on') and watt >= 100 and 0 <= soc < maal %}lad
        {% elif styrer and (soc <= maal or effekt < 50) and overskud < 200 %}gem
        {% else %}fri{% endif %}
      valg: "{{ 'Enabled Power Control' if tilstand == 'lad' else 'Enabled No Discharge' }}"
    conditions:
      # solax_modbus skal være klar (ved opstart kan Wattlas komme før inverteren)
      - condition: template
        value_template: >-
          {{ has_value('select.min_solax_remotecontrol_power_control_mode_1') and states.number.min_solax_remotecontrol_active_power_mode_1 is not none
             and states.button.min_solax_remotecontrol_trigger_mode_1_7 is not none and soc >= 0 }}
    actions:
      - choose:
          - conditions: "{{ tilstand in ['lad', 'gem'] }}"
            sequence:
              - if: "{{ tilstand == 'lad' and (states('number.min_solax_remotecontrol_active_power_mode_1') | float(-1) - watt) | abs >= 1 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solax_remotecontrol_active_power_mode_1}, data: {value: "{{ watt }}"}}]
              - if: "{{ not is_state('select.min_solax_remotecontrol_power_control_mode_1', valg) }}"
                then: [{action: select.select_option, target: {entity_id: select.min_solax_remotecontrol_power_control_mode_1}, data: {option: "{{ valg }}"}}]
              # gentagelsen fornyes hvert minut i 10 min ad gangen; går HA ned, holder den op, og SolaX går tilbage til egen drift
              - if: "{{ states('number.min_solax_remotecontrol_autorepeat_duration_mode_1_9') | float(0) != 600 }}"
                then: [{action: number.set_value, target: {entity_id: number.min_solax_remotecontrol_autorepeat_duration_mode_1_9}, data: {value: 600}}]
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_solax_fjern_styret}
              - action: button.press
                target: {entity_id: button.min_solax_remotecontrol_trigger_mode_1_7}
        default:
          # kun Wattlas' egen fjernstyring slås fra – har du selv slået den til, røres den ikke
          - if: "{{ is_state('input_boolean.wattlas_solax_fjern_styret', 'on') }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target: {entity_id: select.min_solax_remotecontrol_power_control_mode_1}
                data: {option: Disabled}
              - action: number.set_value
                continue_on_error: true
                target: {entity_id: number.min_solax_remotecontrol_autorepeat_duration_mode_1_9}
                data: {value: 0}
              - action: button.press
                target: {entity_id: button.min_solax_remotecontrol_trigger_mode_1_7}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_solax_fjern_styret}
          # stoppede Wattlas solsalget (negativ pris), må det ikke blive stående: din egen eksportgrænse tilbage
          - if: "{{ not styrer and is_state('input_boolean.wattlas_solax_salg_stoppet', 'on') }}"
            then: [{action: switch.turn_on, continue_on_error: true, target: {entity_id: switch.wattlas_solsalg}}]

  - id: wattlas_solax_stroemgraenser
    alias: Wattlas SolaX – strømgrænser fra effekt
    description: >-
      Kanalen regner SolaX-batteriet med 50 V, så Wattlas' strømgrænser (A) følger effekt-indstillingerne (W ÷ 50).
      Ændrer du fx maks. netladeeffekt, følger maks. netladestrøm med.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_number.wattlas_maks_ladeeffekt_w, input_number.wattlas_maks_afladeeffekt_w, input_number.wattlas_maks_netladeeffekt_w]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - {a: input_number.wattlas_maks_ladestroem_a, w: input_number.wattlas_maks_ladeeffekt_w}
            - {a: input_number.wattlas_maks_afladestroem_a, w: input_number.wattlas_maks_afladeeffekt_w}
            - {a: input_number.wattlas_maks_netladestroem_a, w: input_number.wattlas_maks_netladeeffekt_w}
          sequence:
            - if: >-
                {{ states(repeat.item.w) | float(0) > 0
                   and (states(repeat.item.a) | float(0) - (states(repeat.item.w) | float(0) / 50) | round(0)) | abs >= 1 }}
              then:
                - action: input_number.set_value
                  target: {entity_id: "{{ repeat.item.a }}"}
                  data: {value: "{{ (states(repeat.item.w) | float(0) / 50) | round(0) }}"}
