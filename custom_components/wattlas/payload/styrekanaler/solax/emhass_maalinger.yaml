# Wattlas styrekanal – SolaX: målinger fra solax_modbus (SolaX X3-Hybrid G4, trefaset; enheden min_solax_*).
# Fortegn i solax_modbus: "Measured Power" (elmåleren) og "Measured Power L1–L3" er POSITIVE ved salg (husforbruget regnes
# som inverter − målt), "Battery Power Charge" er positiv ved ladning. Til kernen: net positiv = køb, batteri positiv = afladning.
# Fasetal: elmåleren giver hver fase for sig, så kernens fasegrænse får rigtige tal (modsat Growatt).
# Batterispændingen er kanalens faste beregningsspænding på 50 V (højvoltbatteri, se wattlas_kanal_solax.yaml).
template:
- triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      sample: |-
        {% set t = as_timestamp(now()) %}
        {% set status = states('sensor.min_solax_run_mode') %}
        {% set net = -(states('sensor.min_solax_grid_feed_in_power') | float(0)) %}
        {% set imp = [0, net] | max %}
        {% set load = states('sensor.min_solax_house_load') | float(0) %}
        {% set ladning = states('sensor.min_solax_battery_power_charge') | float(0) %}
        {% set chg = [0, ladning] | max %}
        {% set dis = [0, -ladning] | max %}
        {% set pv = states('sensor.min_solax_pv_power_total') | float(0) %}
        {% set m = dict(
          load_w_totalpower = load,
          grid_out_total_power = net,
          battery_output_w_power = -ladning,
          battery_soc = states('sensor.min_solax_battery_capacity'),
          battery_voltage = 50,
          inverter_status = 'Normal' if status in ['Normal Mode', 'Normal (R)', 'Idle Mode'] else status,
          battery_temperature = states('sensor.min_solax_battery_temperature'),
          inverter_temperature = states('sensor.min_solax_inverter_temperature'),
          external_ct_w_l1 = -(states('sensor.min_solax_measured_power_l1') | float(0)),
          external_ct_w_l2 = -(states('sensor.min_solax_measured_power_l2') | float(0)),
          external_ct_w_l3 = -(states('sensor.min_solax_measured_power_l3') | float(0)),
          grid_current_v_l1 = states('sensor.min_solax_grid_voltage_l1'),
          grid_current_v_l2 = states('sensor.min_solax_grid_voltage_l2'),
          grid_current_v_l3 = states('sensor.min_solax_grid_voltage_l3')) %}
        {% set kilder = ['sensor.min_solax_grid_feed_in_power', 'sensor.min_solax_house_load', 'sensor.min_solax_battery_power_charge',
                         'sensor.min_solax_battery_capacity', 'sensor.min_solax_pv_power_total',
                         'sensor.min_solax_measured_power_l1', 'sensor.min_solax_measured_power_l2', 'sensor.min_solax_measured_power_l3',
                         'sensor.min_solax_grid_voltage_l1', 'sensor.min_solax_grid_voltage_l2', 'sensor.min_solax_grid_voltage_l3'] %}
        {% set ns = namespace(ok=has_value('sensor.min_solax_run_mode'), aeldst=t) %}
        {% for e in kilder %}
          {% set s = states[e] %}
          {% if s is none or not is_number(s.state) %}{% set ns.ok = false %}
          {% else %}{% set ns.aeldst = [ns.aeldst, as_timestamp(s.last_reported, 0)] | min %}{% endif %}
        {% endfor %}
        {# Kommando-tjek, mens Wattlas beder SolaX om at lade: aflader batteriet i stedet, lades der tydeligt fra nettet,
           uden at elmåleren viser køb (måleren mangler eller sidder forkert), eller lades der mere fra nettet end bedt om
           (kernens fasegrænse regner med det, den bad om), bruges målingerne ikke. #}
        {% set lader = is_state('input_boolean.wattlas_solax_fjern_styret', 'on')
                       and is_state('select.min_solax_remotecontrol_power_control_mode_1', 'Enabled Power Control')
                       and states('number.min_solax_remotecontrol_active_power_mode_1') | float(0) > 0 %}
        {% set fra_net = chg - [0, pv - load] | max %}
        {% set bedt = states('number.min_solax_remotecontrol_active_power_mode_1') | float(0) %}
        {% set balance_ok = not (lader and (dis > 300 or (fra_net > 1000 and imp < 200) or fra_net > bedt * 1.25 + 300)) %}
        {# Blokér først efter 2 min i træk: batteriet skifter ikke retning på et øjeblik, og målingerne læses ikke samtidig. #}
        {% set fejl_siden = 0 if balance_ok else (state_attr('sensor.emhass_maalekilde', 'balance_fejl_siden') | float(0) or t) %}
        {# Kommando-fejlene ses kun, mens der lades: stopper kernen ladningen, ser alt normalt ud igen, og den ville starte
           forfra. Derfor spærres kanalen i 1 time efter en afvisning (shortcut: fast 1 time, ingen nulstilling – ret ved behov). #}
        {% set spaerret_til = t + 3600 if not balance_ok and t - fejl_siden >= 120
                              else state_attr('sensor.emhass_maalekilde', 'spaerret_til') | float(0) %}
        {% set ok = ns.ok and (balance_ok or t - fejl_siden < 120) and t >= spaerret_til and 0 <= t - ns.aeldst <= 90 %}
        {% set tider = namespace(d={}) %}
        {% for k in m %}{% set tider.d = dict(tider.d, **{k: ns.aeldst}) %}{% endfor %}
        {{ dict(source=('SolaX' if ok else 'Ingen'), values=(m if ok else {}),
                times=(tider.d if ok else {}), solax_ok=ok, balance_ok=balance_ok, balance_fejl_siden=fejl_siden, spaerret_til=spaerret_til, time=t) }}
  sensor:
  - name: EMHASS målekilde
    unique_id: emhass_maalekilde
    default_entity_id: sensor.emhass_maalekilde
    state: '{{ sample.source }}'
    attributes:
      values: '{{ sample[''values''] }}'
      raw_reported: '{{ sample[''times''] }}'
      solax_ok: '{{ sample[''solax_ok''] }}'
      balance_ok: '{{ sample[''balance_ok''] }}'
      balance_fejl_siden: '{{ sample[''balance_fejl_siden''] }}'
      spaerret_til: '{{ sample[''spaerret_til''] }}'
      sample_time: '{{ sample[''time''] }}'
- sensor:
  - name: EMHASS måling load_w_totalpower
    unique_id: emhass_m_load_w_totalpower
    default_entity_id: sensor.emhass_m_load_w_totalpower
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''load_w_totalpower'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''load_w_totalpower'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
