      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_output_w_power'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''battery_output_w_power'',0)
        }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: EMHASS måling battery_soc
    unique_id: emhass_m_battery_soc
    default_entity_id: sensor.emhass_m_battery_soc
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_soc'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_soc'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''battery_soc'',0)
        }}'
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
  - name: EMHASS måling battery_voltage
    unique_id: emhass_m_battery_voltage
    default_entity_id: sensor.emhass_m_battery_voltage
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_voltage'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_voltage'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''battery_voltage'',0)
        }}'
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - name: EMHASS måling inverter_status
    unique_id: emhass_m_inverter_status
    default_entity_id: sensor.emhass_m_inverter_status
    state: '{% set v=(state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''inverter_status'',''unavailable'')
      %}{{ ''Normal'' if v|lower==''normal'' else v }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''inverter_status'',''unavailable'') not
      in [''unknown'',''unavailable''] }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''inverter_status'',0)
        }}'
  - name: EMHASS måling battery_temperature
    unique_id: emhass_m_battery_temperature
    default_entity_id: sensor.emhass_m_battery_temperature
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_temperature'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''battery_temperature'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''battery_temperature'',0)
        }}'
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: EMHASS måling inverter_temperature
    unique_id: emhass_m_inverter_temperature
    default_entity_id: sensor.emhass_m_inverter_temperature
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''inverter_temperature'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''inverter_temperature'',''unavailable''))
      }}'
    attributes:
      kilde: '{{ states(''sensor.emhass_maalekilde'') }}'
      raw_reported: '{{ (state_attr(''sensor.emhass_maalekilde'',''raw_reported'') or {}).get(''inverter_temperature'',0)
        }}'
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: EMHASS måling external_ct_w_l1
    unique_id: emhass_m_external_ct_w_l1
    default_entity_id: sensor.emhass_m_external_ct_w_l1
    state: '{{ (state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''external_ct_w_l1'',''unavailable'')
      }}'
    availability: '{{ states(''sensor.emhass_maalekilde'') in [''SolaX''] and 0<=as_timestamp(now())-(state_attr(''sensor.emhass_maalekilde'',''sample_time'')|float(0))<=25
      and is_number((state_attr(''sensor.emhass_maalekilde'',''values'') or {}).get(''external_ct_w_l1'',''unavailable''))
      }}'
    attributes:
