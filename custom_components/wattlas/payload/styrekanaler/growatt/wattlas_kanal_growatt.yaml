# Wattlas styrekanal – Growatt-hybrid (GEN4, fx MOD TL3-XH / MID TL3-XH) via solax_modbus (wills106/homeassistant-solax-modbus).
# EKSPERIMENTEL: bygget ud fra Growatts VPP-protokol (V2.05) og solax_modbus' kildekode og testet mod en simuleret
# Growatt – ikke kørt på et rigtigt anlæg endnu. Kernen taler KUN med Wattlas-entiteterne herunder.
#
# Enheden hedder min_growatt_* (navnet på solax_modbus-forbindelsen vælges i opsætningen). Kun trefasede Growatt
# (X3) med Growatt-elmåler. Kræver lokal forbindelse (Modbus TCP/RTU) – Growatts sky er for langsom til fasegrænsen.
# I solax_modbus skal "VPP Status" stå på "Enabled" (Growatts tilladelse til fjernstyring).
#
# Styring sker gennem Growatts VPP-fjernstyring (registre 30407–30410, 30216 – ingen af dem gemmes i inverterens
# hukommelse, så hyppige skrivninger slider ikke):
#   netladning = VPP Power +% i 10 min ad gangen (fornyes hvert minut) med "VPP AC Charge Max Power 2" som loft
#                for ladning fra nettet. Går HA ned, går inverteren selv tilbage til normal drift inden for 10 min.
#   gem        = VPP Power 0 % (batteriet hverken lader eller aflader) – kun uden soloverskud; med overskud egen drift
#   fri        = fjernstyring fra – inverteren kører sin egen drift (typisk "Load first")
# Højvoltbatteri: kernen regner i A ved et lavvoltbatteri. Kanalen bruger en fast beregningsspænding på 50 V
# (A × 50 = W) – samme tal som i opsætningen.
#
# Growatt har ingen tidsprogrammer, Wattlas kan bruge. Kanalen husker dem selv og bruger det aktive programs værdier i
# samme perioder som kernen (1: 01–05, 2: 05–09, 3: 09–13, 4: 13–17, 5: 17–21, 6: 21–01):
#   SOC    = bundgrænse (ved eller under den gemmes batteriet) og mål ved netladning
#   effekt = 0 W gemmer batteriet; over 0 W må det aflade frit (Growatt kan ikke begrænse afladningen til et bestemt antal W)
# Solsalg fra = eksportgrænsen (Grid Export Limit) sættes til 0 %; din egen grænse huskes og sættes tilbage.
#   Kræver, at eksportbegrænsning (Limit Grid Export) allerede er slået til med måleren – ellers rører Wattlas den ikke.
input_boolean:
  wattlas_growatt_netladning:
    name: Wattlas Growatt netladning (husket)
  wattlas_growatt_vpp_styret:
    name: Wattlas Growatt har slået fjernstyring til
  wattlas_growatt_salg_stoppet:
    name: Wattlas Growatt har stoppet solsalget
  wattlas_growatt_p1:
    name: Wattlas Growatt netladning program 1 (husket)
  wattlas_growatt_p2:
    name: Wattlas Growatt netladning program 2 (husket)
  wattlas_growatt_p3:
    name: Wattlas Growatt netladning program 3 (husket)
  wattlas_growatt_p4:
    name: Wattlas Growatt netladning program 4 (husket)
  wattlas_growatt_p5:
    name: Wattlas Growatt netladning program 5 (husket)
  wattlas_growatt_p6:
    name: Wattlas Growatt netladning program 6 (husket)
input_number:
  wattlas_growatt_netladestroem:
    name: Wattlas Growatt netladestrøm (husket)
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: A
  wattlas_growatt_egen_eksportgraense:
    name: Wattlas Growatt – din egen eksportgrænse (husket)
    min: -100
    max: 100
    step: 0.1
    unit_of_measurement: "%"
  wattlas_growatt_p1_soc:
    name: Wattlas Growatt program 1 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p1_power:
    name: Wattlas Growatt program 1 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_growatt_p2_soc:
    name: Wattlas Growatt program 2 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p2_power:
    name: Wattlas Growatt program 2 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_growatt_p3_soc:
    name: Wattlas Growatt program 3 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p3_power:
    name: Wattlas Growatt program 3 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_growatt_p4_soc:
    name: Wattlas Growatt program 4 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p4_power:
    name: Wattlas Growatt program 4 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_growatt_p5_soc:
    name: Wattlas Growatt program 5 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p5_power:
    name: Wattlas Growatt program 5 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
  wattlas_growatt_p6_soc:
    name: Wattlas Growatt program 6 SOC (husket)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  wattlas_growatt_p6_power:
    name: Wattlas Growatt program 6 effekt (husket)
    min: 0
    max: 50000
    step: 10
    unit_of_measurement: W
template:
  - switch:
      - name: EMHASS netladning program 1
        unique_id: emhass_netladning_p1
        default_entity_id: switch.emhass_netladning_p1
        state: "{{ is_state('input_boolean.wattlas_growatt_p1', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p1}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p1}}]
      - name: EMHASS netladning program 2
        unique_id: emhass_netladning_p2
        default_entity_id: switch.emhass_netladning_p2
        state: "{{ is_state('input_boolean.wattlas_growatt_p2', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p2}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p2}}]
      - name: EMHASS netladning program 3
        unique_id: emhass_netladning_p3
        default_entity_id: switch.emhass_netladning_p3
        state: "{{ is_state('input_boolean.wattlas_growatt_p3', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p3}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p3}}]
      - name: EMHASS netladning program 4
        unique_id: emhass_netladning_p4
        default_entity_id: switch.emhass_netladning_p4
        state: "{{ is_state('input_boolean.wattlas_growatt_p4', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p4}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p4}}]
      - name: EMHASS netladning program 5
        unique_id: emhass_netladning_p5
        default_entity_id: switch.emhass_netladning_p5
        state: "{{ is_state('input_boolean.wattlas_growatt_p5', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p5}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p5}}]
      - name: EMHASS netladning program 6
        unique_id: emhass_netladning_p6
        default_entity_id: switch.emhass_netladning_p6
        state: "{{ is_state('input_boolean.wattlas_growatt_p6', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_p6}}]
        turn_off: [{action: input_boolean.turn_off, target: {entity_id: input_boolean.wattlas_growatt_p6}}]
      - name: Wattlas netladning
        unique_id: wattlas_netladning
        default_entity_id: switch.wattlas_netladning
        availability: "{{ has_value('select.min_growatt_vpp_remote_control') }}"
        state: "{{ is_state('input_boolean.wattlas_growatt_netladning', 'on') }}"
        turn_on: [{action: input_boolean.turn_on, target: {entity_id: input_boolean.wattlas_growatt_netladning}}]
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.wattlas_growatt_netladning}
          # stoppes med det samme her (automationen nedenfor gør det også), så "fra" er fra, når kernen går videre
          - if: "{{ is_state('input_boolean.wattlas_growatt_vpp_styret', 'on') and states('number.min_growatt_vpp_power') | float(0) > 0 }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target: {entity_id: number.min_growatt_vpp_power}
                data: {value: 0}
      - name: Wattlas solsalg
        unique_id: wattlas_solsalg
        default_entity_id: switch.wattlas_solsalg
        # kun når eksportbegrænsning allerede er slået til med måleren – Wattlas vælger ikke måler for dig
        availability: >-
          {{ is_number(states('number.min_growatt_grid_export_limit')) and has_value('select.min_growatt_limit_grid_export')
             and not is_state('select.min_growatt_limit_grid_export', 'Disabled') }}
        # "til", indtil Wattlas selv har stoppet salget – en ny installation skriver derfor intet til inverteren
        state: "{{ not is_state('input_boolean.wattlas_growatt_salg_stoppet', 'on') }}"
        turn_on:
          - if: "{{ is_state('input_boolean.wattlas_growatt_salg_stoppet', 'on') }}"
            then:
              - action: number.set_value
                target: {entity_id: number.min_growatt_grid_export_limit}
                data: {value: "{{ states('input_number.wattlas_growatt_egen_eksportgraense') | float(0) }}"}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_growatt_salg_stoppet}
        turn_off:
          # eksportgrænsen gemmes i inverterens hukommelse – skrives kun, når den skifter
          - if: "{{ not is_state('input_boolean.wattlas_growatt_salg_stoppet', 'on') }}"
            then:
              - action: input_number.set_value
                target: {entity_id: input_number.wattlas_growatt_egen_eksportgraense}
                data: {value: "{{ states('number.min_growatt_grid_export_limit') | float(0) }}"}
              - action: number.set_value
                target: {entity_id: number.min_growatt_grid_export_limit}
                data: {value: 0}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_growatt_salg_stoppet}
  - number:
      - name: Wattlas netladestrøm
        unique_id: wattlas_netladestroem
        default_entity_id: number.wattlas_netladestroem
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ states('input_number.wattlas_growatt_netladestroem') | float(0) }}"
        min: 0
        max: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
        step: 1
        unit_of_measurement: A
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_netladestroem}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 SOC
        unique_id: wattlas_program_1_soc
        default_entity_id: number.wattlas_program_1_soc
        state: "{{ states('input_number.wattlas_growatt_p1_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p1_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 1 effekt
        unique_id: wattlas_program_1_power
        default_entity_id: number.wattlas_program_1_power
        state: "{{ states('input_number.wattlas_growatt_p1_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p1_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 SOC
        unique_id: wattlas_program_2_soc
        default_entity_id: number.wattlas_program_2_soc
        state: "{{ states('input_number.wattlas_growatt_p2_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p2_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 2 effekt
        unique_id: wattlas_program_2_power
        default_entity_id: number.wattlas_program_2_power
        state: "{{ states('input_number.wattlas_growatt_p2_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p2_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 SOC
        unique_id: wattlas_program_3_soc
        default_entity_id: number.wattlas_program_3_soc
        state: "{{ states('input_number.wattlas_growatt_p3_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p3_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 3 effekt
        unique_id: wattlas_program_3_power
        default_entity_id: number.wattlas_program_3_power
        state: "{{ states('input_number.wattlas_growatt_p3_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p3_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 SOC
        unique_id: wattlas_program_4_soc
        default_entity_id: number.wattlas_program_4_soc
        state: "{{ states('input_number.wattlas_growatt_p4_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p4_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 4 effekt
        unique_id: wattlas_program_4_power
        default_entity_id: number.wattlas_program_4_power
        state: "{{ states('input_number.wattlas_growatt_p4_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p4_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 SOC
        unique_id: wattlas_program_5_soc
        default_entity_id: number.wattlas_program_5_soc
        state: "{{ states('input_number.wattlas_growatt_p5_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p5_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 5 effekt
        unique_id: wattlas_program_5_power
        default_entity_id: number.wattlas_program_5_power
        state: "{{ states('input_number.wattlas_growatt_p5_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p5_power}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 SOC
        unique_id: wattlas_program_6_soc
        default_entity_id: number.wattlas_program_6_soc
        state: "{{ states('input_number.wattlas_growatt_p6_soc') | float(0) }}"
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p6_soc}, data: {value: "{{ value }}"}}]
      - name: Wattlas program 6 effekt
        unique_id: wattlas_program_6_power
        default_entity_id: number.wattlas_program_6_power
        state: "{{ states('input_number.wattlas_growatt_p6_power') | float(0) }}"
        min: 0
        max: 50000
        step: 10
        unit_of_measurement: "W"
        set_value: [{action: input_number.set_value, target: {entity_id: input_number.wattlas_growatt_p6_power}, data: {value: "{{ value }}"}}]
  - sensor:
      # Growatt melder ikke batteriets maksimale effekt – kanalen bruger din indstilling "maks. ladeeffekt" (W ÷ 50)
      - name: Wattlas maks. ladestrøm
        unique_id: wattlas_maks_ladestroem
        default_entity_id: sensor.wattlas_maks_ladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_ladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: Wattlas maks. afladestrøm
        unique_id: wattlas_maks_afladestroem
        default_entity_id: sensor.wattlas_maks_afladestroem
        unit_of_measurement: A
        availability: "{{ states('input_number.wattlas_maks_afladeeffekt_w') | float(0) > 0 }}"
        state: "{{ (states('input_number.wattlas_maks_afladeeffekt_w') | float(0) / 50) | round(0, 'floor') }}"
      - name: EMHASS Solproduktion samlet
        unique_id: emhass_solproduktion_samlet
        default_entity_id: sensor.emhass_solproduktion_samlet
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.min_growatt_pv_power_total')) }}"
        state: "{{ [0, states('sensor.min_growatt_pv_power_total') | float(0)] | max | round(0) }}"
      - name: Wattlas batteri ladet i dag
        unique_id: wattlas_i_dag_ladet
        default_entity_id: sensor.wattlas_i_dag_ladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_growatt_today_s_battery_input_energy')) }}"
        state: "{{ states('sensor.min_growatt_today_s_battery_input_energy') | float(0) }}"
      - name: Wattlas batteri afladet i dag
        unique_id: wattlas_i_dag_afladet
        default_entity_id: sensor.wattlas_i_dag_afladet
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ is_number(states('sensor.min_growatt_today_s_battery_output_energy')) }}"
        state: "{{ states('sensor.min_growatt_today_s_battery_output_energy') | float(0) }}"
  - binary_sensor:
      - name: Wattlas tidsprogrammer aktive
        unique_id: wattlas_tidsprogram_aktiv
        default_entity_id: binary_sensor.wattlas_tidsprogram_aktiv
        # Growatt har ingen tidsprogrammer; kanalens egne virker, når Growatt tillader fjernstyring (VPP Status = Enabled)
        state: "{{ is_state('select.min_growatt_vpp_status', 'Enabled') and has_value('select.min_growatt_vpp_remote_control') }}"
      - name: Wattlas inverter forbundet
        unique_id: wattlas_forbindelse
        default_entity_id: binary_sensor.wattlas_forbindelse
        device_class: connectivity
        state: >-
          {% set s = states.sensor.min_growatt_machine_status %}
          {{ s is not none and s.state not in ['unknown', 'unavailable'] and (now() - s.last_reported).total_seconds() < 300 }}
      - name: Wattlas PV-måling OK
        unique_id: wattlas_pv_maaling_ok
        default_entity_id: binary_sensor.wattlas_pv_maaling_ok
        state: "{{ is_number(states('sensor.min_growatt_pv_power_total')) }}"

# Growatts "i alt"-tællere for køb/salg er slået fra som standard i solax_modbus. Produktion, forbrug og købt/solgt
# laves derfor her med HA's egne værktøjer ud fra effekterne.
sensor:
  - platform: integration
    source: sensor.emhass_solproduktion_samlet
    name: wattlas_total_produktion  # navnet bliver entity_id
    unique_id: wattlas_total_produktion
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_growatt_total_load_power
    name: wattlas_total_forbrug  # navnet bliver entity_id
    unique_id: wattlas_total_forbrug
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_growatt_total_import_power
    name: wattlas_total_koebt  # navnet bliver entity_id
    unique_id: wattlas_total_koebt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
  - platform: integration
    source: sensor.min_growatt_total_export_power
    name: wattlas_total_solgt  # navnet bliver entity_id
    unique_id: wattlas_total_solgt
    unit_prefix: k
    round: 2
    method: left
    max_sub_interval: {minutes: 1}
utility_meter:
  wattlas_i_dag_produktion:
    unique_id: wattlas_i_dag_produktion
    source: sensor.wattlas_total_produktion
    cycle: daily
  wattlas_i_dag_forbrug:
    unique_id: wattlas_i_dag_forbrug
    source: sensor.wattlas_total_forbrug
    cycle: daily
  wattlas_i_dag_koebt:
    unique_id: wattlas_i_dag_koebt
    source: sensor.wattlas_total_koebt
    cycle: daily
  wattlas_i_dag_solgt:
    unique_id: wattlas_i_dag_solgt
    source: sensor.wattlas_total_solgt
    cycle: daily

automation:
  - id: wattlas_growatt_styring
    alias: Wattlas Growatt – styring
    description: >-
      Det eneste sted, Wattlas styrer Growatt. Lader fra nettet (i 10 min ad gangen, kun op til det aktive programs SOC),
      gemmer batteriet (0 %) eller giver inverteren sin egen drift tilbage. Uden for styringen slås kun Wattlas' egen
      fjernstyring fra, og et stoppet solsalg gives tilbage.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: [input_boolean.wattlas_growatt_netladning, input_number.wattlas_growatt_netladestroem,
                    input_boolean.emhass_styring_aktiv, input_boolean.emhass_har_overtaget]
      - trigger: state
        entity_id: [input_boolean.wattlas_growatt_p1, input_boolean.wattlas_growatt_p2, input_boolean.wattlas_growatt_p3,
                    input_boolean.wattlas_growatt_p4, input_boolean.wattlas_growatt_p5, input_boolean.wattlas_growatt_p6]
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
    variables:
      periode: "{{ 6 if now().hour < 1 else 1 if now().hour < 5 else 2 if now().hour < 9 else 3 if now().hour < 13 else 4 if now().hour < 17 else 5 if now().hour < 21 else 6 }}"
      soc: "{{ states('sensor.min_growatt_battery_soc') | float(-1) }}"
      maal: "{{ states('input_number.wattlas_growatt_p' ~ periode ~ '_soc') | float(0) }}"
      effekt: "{{ states('input_number.wattlas_growatt_p' ~ periode ~ '_power') | float(0) }}"
      loft: "{{ states('input_number.wattlas_maks_ladeeffekt_w') | float(0) }}"
      watt: "{{ [states('input_number.wattlas_growatt_netladestroem') | float(0) * 50, loft] | min | int(0) }}"
      # VPP Power er en procentdel; den rundes NED i trin á 5 %, og "VPP AC Charge Max Power 2" er loftet for ladning fra nettet
      procent: "{{ [100, ((watt / loft * 20) | round(0, 'floor') * 5) if loft > 0 else 0] | min | int }}"
      kw: "{{ ((watt / 100) | round(0, 'floor')) / 10 }}"
      styrer: "{{ is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.emhass_har_overtaget', 'on') }}"
      # 0 % stopper også solladning – med soloverskud køres egen drift (overskuddet lades, intet aflades)
      overskud: "{{ states('sensor.min_growatt_pv_power_total') | float(0) - states('sensor.min_growatt_total_load_power') | float(0) }}"
      tilstand: >-
        {% if is_state('input_boolean.emhass_styring_aktiv', 'on') and is_state('input_boolean.wattlas_growatt_netladning', 'on')
              and is_state('input_boolean.wattlas_growatt_p' ~ periode, 'on') and procent >= 5 and kw >= 0.1 and 0 <= soc < maal %}lad
        {% elif styrer and (soc <= maal or effekt < 50) and overskud < 200 %}gem
        {% else %}fri{% endif %}
    conditions:
      # solax_modbus skal være klar (ved opstart kan Wattlas komme før inverteren)
      - condition: template
        value_template: "{{ has_value('select.min_growatt_vpp_remote_control') and is_number(states('number.min_growatt_vpp_power')) and soc >= 0 }}"
    actions:
      - choose:
          - conditions: "{{ tilstand in ['lad', 'gem'] }}"
            sequence:
              - if: "{{ tilstand == 'lad' }}"
                then:
                  - if: "{{ (states('number.min_growatt_vpp_ac_charge_max_power_2') | float(-1) - kw) | abs >= 0.1 }}"
                    then: [{action: number.set_value, target: {entity_id: number.min_growatt_vpp_ac_charge_max_power_2}, data: {value: "{{ kw }}"}}]
                  # gemmes i inverteren – skrives kun, hvis den ikke allerede er slået til
                  - if: "{{ not is_state('select.min_growatt_vpp_allow_ac_charging', 'Enabled') }}"
                    then: [{action: select.select_option, target: {entity_id: select.min_growatt_vpp_allow_ac_charging}, data: {option: Enabled}}]
              - variables:
                  ny: "{{ procent if tilstand == 'lad' else 0 }}"
              - if: "{{ states('number.min_growatt_vpp_power') | float(-999) != ny }}"
                then: [{action: number.set_value, target: {entity_id: number.min_growatt_vpp_power}, data: {value: "{{ ny }}"}}]
              # nedtællingen fornyes hvert minut: går HA ned, holder inverteren selv op efter 10 min (0 = uendeligt – bruges aldrig)
              - action: number.set_value
                target: {entity_id: number.min_growatt_vpp_time}
                data: {value: 10}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.wattlas_growatt_vpp_styret}
              - if: "{{ not is_state('select.min_growatt_vpp_remote_control', 'Enabled') }}"
                then: [{action: select.select_option, target: {entity_id: select.min_growatt_vpp_remote_control}, data: {option: Enabled}}]
        default:
          # kun Wattlas' egen fjernstyring slås fra – har du selv slået den til, røres den ikke
          - if: "{{ is_state('input_boolean.wattlas_growatt_vpp_styret', 'on') }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target: {entity_id: number.min_growatt_vpp_power}
                data: {value: 0}
              - action: select.select_option
                target: {entity_id: select.min_growatt_vpp_remote_control}
                data: {option: Disabled}
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.wattlas_growatt_vpp_styret}
          # stoppede Wattlas solsalget (negativ pris), må det ikke blive stående: din egen eksportgrænse tilbage
          - if: "{{ not styrer and is_state('input_boolean.wattlas_growatt_salg_stoppet', 'on') }}"
            then: [{action: switch.turn_on, continue_on_error: true, target: {entity_id: switch.wattlas_solsalg}}]

  - id: wattlas_growatt_stroemgraenser
    alias: Wattlas Growatt – strømgrænser fra effekt
    description: >-
      Kanalen regner Growatt-batteriet med 50 V, så Wattlas' strømgrænser (A) følger effekt-indstillingerne (W ÷ 50).
      Ændrer du fx maks. netladeeffekt, følger maks. netladestrøm med.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_number.wattlas_maks_ladeeffekt_w, input_number.wattlas_maks_afladeeffekt_w, input_number.wattlas_maks_netladeeffekt_w]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - {a: input_number.wattlas_maks_ladestroem_a, w: input_number.wattlas_maks_ladeeffekt_w}
            - {a: input_number.wattlas_maks_afladestroem_a, w: input_number.wattlas_maks_afladeeffekt_w}
            - {a: input_number.wattlas_maks_netladestroem_a, w: input_number.wattlas_maks_netladeeffekt_w}
          sequence:
            - if: >-
                {{ states(repeat.item.w) | float(0) > 0
                   and (states(repeat.item.a) | float(0) - (states(repeat.item.w) | float(0) / 50) | round(0)) | abs >= 1 }}
              then:
                - action: input_number.set_value
                  target: {entity_id: "{{ repeat.item.a }}"}
                  data: {value: "{{ (states(repeat.item.w) | float(0) / 50) | round(0) }}"}
