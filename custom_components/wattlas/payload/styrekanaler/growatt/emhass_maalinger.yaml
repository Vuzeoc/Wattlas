  binary_sensor:
  - name: EMHASS styrekanal (Growatt)
    unique_id: emhass_styrekanal_ok
    default_entity_id: binary_sensor.emhass_styrekanal_ok
    state: |-
      {% set t=as_timestamp(now()) %}
      {% set ns=namespace(ok=true) %}
      {% for e in ['number.min_growatt_vpp_power','number.min_growatt_vpp_time','number.min_growatt_vpp_ac_charge_max_power_2'] %}
       {% if not is_number(states(e)) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {% for i in range(1,7) %}
       {% for suffix in ['soc','power'] %}
       {% if not is_number(states('number.wattlas_program_'~i~'_'~suffix)) %}{% set ns.ok=false %}{% endif %}
       {% endfor %}
       {% if not has_value('switch.emhass_netladning_p'~i) %}{% set ns.ok=false %}{% endif %}
      {% endfor %}
      {{ ns.ok and is_state_attr('sensor.emhass_maalekilde','growatt_ok',true)
       and 0<=t-(state_attr('sensor.emhass_maalekilde','sample_time')|float(0))<=90
       and has_value('select.min_growatt_vpp_remote_control')
       and has_value('select.min_growatt_vpp_allow_ac_charging')
       and is_state('select.min_growatt_vpp_status','Enabled')
       and states('input_number.wattlas_maks_ladeeffekt_w')|float(0) > 0 }}
  - name: EMHASS mangler inverterstyring
    unique_id: emhass_ui_styrekanalfejl
    default_entity_id: binary_sensor.emhass_ui_styrekanalfejl
    state: '{{ is_state(''input_boolean.emhass_styring_aktiv'',''on'') and not is_state(''binary_sensor.emhass_styrekanal_ok'',''on'')
      }}'
    device_class: problem
    delay_on:
      seconds: 120
    delay_off:
      seconds: 30
    attributes:
      forklaring: Growatt-styrekanalen er ikke klar – målinger mangler eller er gamle, VPP Status står ikke på "Enabled",
        VPP-indstillingerne findes ikke i solax_modbus, eller batteriet gjorde det modsatte af, hvad Wattlas bad om. Netopladning er forsøgt stoppet; faktisk inverterdrift skal kontrolleres.
