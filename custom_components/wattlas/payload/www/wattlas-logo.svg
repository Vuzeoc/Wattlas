<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wl-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="wl-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="wl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- atlas: globus med længde- og breddegrader -->
  <circle cx="60" cy="60" r="56" fill="url(#wl-core)"/>
  <g fill="none" stroke="url(#wl-g)" stroke-width="1.4" opacity="0.55">
    <ellipse cx="60" cy="60" rx="50" ry="50"/>
    <ellipse cx="60" cy="60" rx="22" ry="50"/>
    <ellipse cx="60" cy="60" rx="50" ry="18"/>
    <path d="M14 42 H106 M14 78 H106"/>
  </g>
  <!-- HUD-ring med åbninger -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#wl-g)" stroke-width="2.5" stroke-dasharray="70 18 40 18" filter="url(#wl-glow)"/>
  <!-- W hvor midterspidsen er et lyn -->
  <path d="M28 38 L40 84 L52 56 L46 56 L62 30 L57 52 L66 52 L68 56 L80 84 L92 38"
        fill="none" stroke="url(#wl-g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#wl-glow)"/>
  <circle cx="60" cy="60" r="3" fill="#e0f7ff"/>
</svg>
